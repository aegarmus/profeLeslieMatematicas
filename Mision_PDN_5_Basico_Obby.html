const topics=[['fractions','🌳 Bosque de las fracciones'],['measure','🧪 Laboratorio de las medidas'],['geometry','🏙️ Ciudad de la geometría'],['coordinates','🌌 Universo cartesiano'],['transform','🌀 Templo de las transformaciones']];
const lessons={
fractions:{title:'Fracciones, números mixtos y orden',definition:'Una fracción muestra cuántas partes iguales tomamos de un entero. Numerador: partes tomadas. Denominador: partes totales. Una fracción impropia puede escribirse como número mixto. También podemos ordenar fracciones comparando sus valores.',steps:['Ejemplo: transforma 13/5 en número mixto.','Divide 13 entre 5: caben 2 enteros y sobran 3.','Conserva el denominador 5: 13/5 = 2 3/5.'],tip:'Para ordenar fracciones, compáralas con un mismo denominador. Si ya tienen igual denominador, la que tiene mayor numerador es mayor. También puedes usar dibujos de barras.',practice:'¿Cómo escribirías 9/4 como número mixto? R: 2 1/4.'},
measure:{title:'Unidades de longitud',definition:'1 m = 100 cm = 1.000 mm; 1 cm = 10 mm; 1 km = 1.000 m. Para comparar longitudes, primero exprésalas en la misma unidad.',steps:['Ejemplo: convierte 2 m 35 cm a centímetros.','2 m equivalen a 200 cm.','200 cm + 35 cm = 235 cm.'],tip:'Para medir una cinta sobre una regla que no comienza en 0, resta marca final menos marca inicial.',practice:'¿Cuántos mm son 18 cm? R: 180 mm.'},
geometry:{title:'Área y perímetro',definition:'Perímetro: suma de las longitudes de todos los lados. Área: superficie interior. Rectángulo: P=2(largo+ancho), A=largo×ancho. Triángulo: A=(base×altura)/2. Paralelogramo: A=base×altura perpendicular.',steps:['Ejemplo: calcula el perímetro de un rectángulo de 8 cm por 3 cm.','Suma los cuatro lados: 8 + 3 + 8 + 3.','Perímetro = 22 cm. El área, en cambio, sería 8×3=24 cm².'],tip:'Un área se expresa en unidades cuadradas (cm², m²). Un perímetro, en unidades de longitud (cm, m).',practice:'Rectángulo de 5 m por 4 m: perímetro 18 m; área 20 m².'},
coordinates:{title:'Plano cartesiano',definition:'Un punto se escribe (x, y): primero avanzas horizontalmente según x, luego verticalmente según y. En el primer cuadrante ambas coordenadas son positivas.',steps:['Ejemplo: ubica el punto (4, 2).','Desde el origen (0,0), avanza 4 a la derecha.','Sube 2 unidades y marca el punto.'],tip:'No inviertas el orden: (2,4) no es el mismo punto que (4,2).',practice:'Si (3,3) se mueve dos cuadros a la derecha, llega a (5,3).'},
transform:{title:'Traslación, reflexión y rotación',definition:'Traslación: deslizar una figura sin girarla. Reflexión: obtener su imagen en un espejo respecto de un eje. Rotación: girar alrededor de un punto. Las tres conservan forma y tamaño.',steps:['Ejemplo: traslada (2,3) tres cuadros a la derecha y uno hacia arriba.','Suma 3 a la coordenada x: 2+3=5.','Suma 1 a la coordenada y: 3+1=4. Nuevo punto: (5,4).'],tip:'Si una figura se refleja en un eje vertical, se invierte izquierda-derecha.',practice:'Mover una figura sin girarla ni voltearla es una traslación.'}
};
let bank=[];const gcd=(a,b)=>b?gcd(b,a%b):a;const frac=(a,b)=>`${a}/${b}`;const pick=(arr)=>arr[Math.floor(Math.random()*arr.length)];function add(topic,prompt,answer,wrong,explain,graphic=null,hint='Piensa qué procedimiento matemático corresponde y comprueba las unidades.') {let opts=[String(answer),...wrong.map(String)].filter((v,i,a)=>a.indexOf(v)===i);if(opts.length!==4)throw Error('Alternativas repetidas: '+prompt);bank.push({id:'q'+bank.length,topic,prompt,correct:String(answer),opts,explain,graphic,hint})}function fracSvg(n,d){return `<svg viewBox="0 0 420 90" role="img" aria-label="Barra dividida en ${d} partes iguales, ${n} coloreadas"><rect x="8" y="17" width="404" height="55" fill="#fff" stroke="#253f71" stroke-width="3"/>${Array.from({length:d},(_,i)=>`<rect x="${8+404*i/d}" y="17" width="${404/d}" height="55" fill="${i<n?'#64b7fa':'#fff'}" stroke="#253f71" stroke-width="1.4"/>`).join('')}</svg>`}function rectSvg(a,b,tri=false){return `<svg viewBox="0 0 440 165" role="img" aria-label="Figura con base ${a} y altura ${b}">${tri?`<polygon points="95,132 350,132 245,22" fill="#93dcbe" stroke="#27526c" stroke-width="3"/><path d="M245 22 L245 132" stroke="#e05d55" stroke-width="2" stroke-dasharray="6,5"/>`:`<rect x="95" y="22" width="255" height="110" fill="#93dcbe" stroke="#27526c" stroke-width="3"/>`}<text x="215" y="157" font-size="19">${a} cm</text><text x="${tri?252:36}" y="78" font-size="18">${b} cm</text></svg>`}function gridSvg(x,y,x2=null,y2=null){let lines='';for(let k=0;k<=6;k++)lines+=`<path d="M${48+k*48} 16V304 M48 ${304-k*48}H336" stroke="#b9cfe6"/>`;return `<svg viewBox="0 0 375 348" role="img" aria-label="Plano cartesiano de 0 a 6 con punto A en (${x},${y})">${lines}<path d="M48 8V304H345" fill="none" stroke="#273e66" stroke-width="3"/>${Array.from({length:7},(_,k)=>`<text x="${45+k*48}" y="325" font-size="13">${k}</text><text x="26" y="${309-k*48}" font-size="13">${k}</text>`).join('')}<circle cx="${48+x*48}" cy="${304-y*48}" r="8" fill="#f36b7e"/><text x="${55+x*48}" y="${295-y*48}" font-weight="bold">A</text>${x2===null?'':`<circle cx="${48+x2*48}" cy="${304-y2*48}" r="7" fill="#277dd0"/>`}</svg>`}
// Generar un banco de 75 ejercicios originales: 15 de cada tema.
for(let i=0;i<15;i++){let k=i%5; if(k===0){let d=5+i,n=(i%4)+2;add('fractions',`Observa la barra: ¿qué fracción está coloreada?`,frac(n,d),[frac(d-n,d+2),frac(n,d+1),frac(n+1,d)],`Hay ${d} partes iguales y ${n} pintadas. Por eso corresponde a ${n}/${d}.`,fracSvg(n,d),'Cuenta todas las partes y después las coloreadas.')} if(k===1){let d=3+i,n=d+((i%3)+1);let whole=Math.floor(n/d),r=n%d;add('fractions',`Convierte la fracción impropia ${n}/${d} a número mixto.`,`${whole} ${r}/${d}`,[`${whole+1} ${r}/${d}`,`${whole} ${r+1}/${d}`,`${whole} ${r}/${d+1}`],`${n} ÷ ${d} da ${whole} entero y sobran ${r}. El número mixto es ${whole} ${r}/${d}.`,null,'Divide numerador entre denominador y observa el resto.')}if(k===2){let a=2+i,b=3+i,m=2+(i%3);add('fractions',`¿Cuál es una fracción equivalente a ${a}/${b}?`,frac(a*m,b*m),[frac(a*m,b),frac(a,b*m),frac(a*m+1,b*m)],`Multiplicamos arriba y abajo por ${m}: ${a}×${m}/${b}×${m} = ${a*m}/${b*m}.`,null,'Amplifica numerador y denominador con el mismo factor.')}if(k===3){
// Ordenar fracciones: reemplaza completamente las preguntas de adición.
let variant=Math.floor(i/5);
if(variant===0){
 let d=8, nums=[2,5,3], correct=`${nums[0]}/${d} < ${nums[2]}/${d} < ${nums[1]}/${d}`;
 add('fractions',`Ordena de menor a mayor las fracciones ${nums[1]}/${d}, ${nums[0]}/${d} y ${nums[2]}/${d}.`,correct,[`${nums[2]}/${d} < ${nums[0]}/${d} < ${nums[1]}/${d}`,`${nums[1]}/${d} < ${nums[2]}/${d} < ${nums[0]}/${d}`,`${nums[0]}/${d} < ${nums[1]}/${d} < ${nums[2]}/${d}`],`Tienen denominador ${d}. Compara los numeradores: 2 < 3 < 5. Por eso ${correct}.`,null,'Cuando todas las fracciones tienen el mismo denominador, compara sus numeradores.');
}else if(variant===1){
 let fs=['3/4','1/2','1/4'];let correct='3/4 > 1/2 > 1/4';
 add('fractions',`Ordena de mayor a menor las fracciones ${fs.join(', ')}.`,correct,['1/2 > 3/4 > 1/4','1/4 > 1/2 > 3/4','3/4 > 1/4 > 1/2'],`Expresamos 1/2 como 2/4. Así comparamos 3/4, 2/4 y 1/4: ${correct}.`,null,'Convierte el medio en cuartos para comparar las tres fracciones.');
}else{
 let correct='2/5 < 1/2 < 3/4';
 add('fractions','Unos estudiantes recorrieron 1/2, 3/4 y 2/5 de una pista. ¿En qué orden, de menor a mayor, están esas fracciones?',correct,['1/2 < 2/5 < 3/4','3/4 < 1/2 < 2/5','2/5 < 3/4 < 1/2'],`Podemos comparar en veinteavos: 2/5=8/20, 1/2=10/20 y 3/4=15/20. Por eso ${correct}.`,null,'Busca fracciones equivalentes con el mismo denominador.');
}
}if(k===4){let d=7+i,a=4+(i%3),b=1+(i%2);add('fractions',`Calcula ${a}/${d} − ${b}/${d}.`,frac(a-b,d),[frac(a+b,d),frac(a-b,d*2),frac(a-b+1,d)],`Restamos los numeradores: ${a}−${b}=${a-b}; conservamos denominador ${d}.`,null,'Con el mismo denominador, solo resta los numeradores.')}}
// Nueve ejercicios adicionales y variados de orden de fracciones.
for (let j=0;j<9;j++) {
 const d=6+j, a=1+j%3, b=3+j%3, c=5+j%3;
 const desc=j%2===1;
 const items=[`${a}/${d}`,`${b}/${d}`,`${c}/${d}`];
 const order=desc?[items[2],items[1],items[0]]:[items[0],items[1],items[2]];
 const sign=desc?' > ':' < ';
 const answer=order.join(sign);
 const incorrect=[
   [items[1],items[0],items[2]].join(sign),
   [items[2],items[0],items[1]].join(sign),
   [items[0],items[2],items[1]].join(sign)
 ];
 const context=j%3===0?`Tres equipos completaron ${items[2]}, ${items[0]} y ${items[1]} de una actividad. `:'';
 add('fractions',`${context}Ordena ${items[2]}, ${items[0]} y ${items[1]} de ${desc?'mayor a menor':'menor a mayor'}.`,answer,incorrect,
   `Todas tienen el mismo denominador (${d}). Comparamos numeradores: ${a}, ${b} y ${c}. Por eso ${answer}.`,null,
   'Cuando los denominadores son iguales, compara los numeradores sin cambiar el denominador.');
}
for(let i=0;i<15;i++){let k=i%5,v=12+i*3;if(k===0)add('measure',`Una tira mide ${v} cm. ¿Cuántos milímetros son?`,`${v*10} mm`,[`${v} mm`,`${v*100} mm`,`${v/10} mm`],`1 cm=10 mm. Entonces ${v}×10=${v*10} mm.`,null,'Recuerda cuántos milímetros hay en cada centímetro.');if(k===1){let m=2+Math.floor(i/5);add('measure',`¿Cuántos centímetros hay en ${m} metros?`,`${m*100} cm`,[`${m*10} cm`,`${m*1000} cm`,`${m} cm`],`1 m = 100 cm; ${m}×100=${m*100} cm.`,null,'Piensa cuántos centímetros equivalen a un metro.')}if(k===2){let a=2+i,b=a+7+(i%4);add('measure',`Una cinta comienza en la marca ${a} cm y termina en ${b} cm. ¿Cuánto mide?`,`${b-a} cm`,[`${b} cm`,`${b+a} cm`,`${a} cm`],`Longitud = marca final − marca inicial = ${b}−${a}=${b-a} cm.`,null,'La cinta no comienza en cero.')}if(k===3){let mm=251+i*10,cm=24+i,m=(26+i)/100;let vals=[mm/10,cm,m*100],max=Math.max(...vals),winner=vals.indexOf(max);let labels=[`${mm} mm`,`${cm} cm`,`${m.toFixed(2).replace('.',',')} m`];if(new Set(vals).size!==3)continue;add('measure',`¿Cuál de estas longitudes es la mayor?`,labels[winner],[...labels.filter((_,j)=>j!==winner),'Las tres son iguales'],`En centímetros: ${mm} mm = ${mm/10} cm; ${cm} cm; ${m.toFixed(2).replace('.',',')} m = ${m*100} cm. La mayor es ${labels[winner]}.`,null,'Convierte todas las medidas a centímetros.')}if(k===4){let km=2+Math.floor(i/5),meters=140+i*11;add('measure',`Un sendero tiene ${km} km y ${meters} m. ¿Cuántos metros tiene en total?`,`${km*1000+meters} m`,[`${km*100+meters} m`,`${km*1000+meters*10} m`,`${km*1000-meters} m`],`${km} km equivalen a ${km*1000} m. Sumamos ${meters} m y obtenemos ${km*1000+meters} m.`,null,'Convierte los kilómetros a metros antes de sumar.')}}
for(let i=0;i<15;i++){let k=i%5,a=5+i,b=3+(i%5);if(k===0)add('geometry',`Un jardín rectangular mide ${a} m por ${b} m. ¿Cuántos metros de cerco se necesitan para rodearlo?`,`${2*(a+b)} m`,[`${a*b} m`,`${a+b} m`,`${2*a*b} m`],`Perímetro = 2×(${a}+${b}) = ${2*(a+b)} m.`,null,'Un cerco recorre todo el contorno.');if(k===1)add('geometry',`Un rectángulo tiene lados ${a} cm y ${b} cm. ¿Cuál es su área?`,`${a*b} cm²`,[`${2*(a+b)} cm²`,`${a+b} cm²`,`${a*b*2} cm²`],`Área = largo×ancho = ${a}×${b}=${a*b} cm².`,rectSvg(a,b),'Piensa cuántos cuadrados unitarios caben en la superficie.');if(k===2){let base=8+i*2,h=4+(i%4);add('geometry',`Un banderín triangular tiene base ${base} cm y altura perpendicular ${h} cm. ¿Cuál es su área?`,`${base*h/2} cm²`,[`${base*h} cm²`,`${base+h} cm²`,`${(base*h/2)+h} cm²`],`Área del triángulo = (${base}×${h})÷2 = ${base*h/2} cm².`,rectSvg(base,h,true),'Piensa en un triángulo como la mitad de un paralelogramo apropiado.')}if(k===3){let base=7+i,h=3+(i%4);add('geometry',`Un paralelogramo tiene base ${base} cm y altura perpendicular ${h} cm. ¿Cuál es su área?`,`${base*h} cm²`,[`${2*(base+h)} cm²`,`${base+h} cm²`,`${base*h/2} cm²`],`Área del paralelogramo = base×altura perpendicular = ${base}×${h}=${base*h} cm².`,null,'Usa la altura perpendicular, no el lado inclinado.')}if(k===4){let length=8+i,width=3+(i%4),per=2*(length+width);add('geometry',`Un terreno rectangular tiene perímetro ${per} m. Si el largo es ${length} m, ¿cuánto mide el ancho?`,`${width} m`,[`${per-length} m`,`${per/2} m`,`${width+2} m`],`La mitad del perímetro es ${per/2} m. Entonces ancho = ${per/2}−${length} = ${width} m.`,null,'Primero calcula la mitad del perímetro.')}}
for(let i=0;i<15;i++){let x=1+i%4,y=1+Math.floor(i/4)%4;let k=i%5;if(k===0)add('coordinates',`En el plano aparece el punto A. ¿Cuáles son sus coordenadas?`,`(${x}, ${y})`,[`(${x+2}, ${y})`,`(${x+1}, ${y})`,`(${x}, ${y+1})`],`Leemos primero x=${x} y luego y=${y}.`,gridSvg(x,y),'La primera coordenada indica el movimiento horizontal.');if(k===1)add('coordinates',`El punto (${x}, ${y}) se mueve 2 unidades a la derecha. ¿Dónde queda?`,`(${x+2}, ${y})`,[`(${x}, ${y+2})`,`(${x-1}, ${y})`,`(${x+1}, ${y+1})`],`Mover a la derecha aumenta x: ${x}+2=${x+2}. y no cambia.`,gridSvg(x,y),'Derecha e izquierda afectan x.');if(k===2)add('coordinates',`El punto (${x}, ${y}) se mueve una unidad hacia arriba. ¿Dónde queda?`,`(${x}, ${y+1})`,[`(${x+1}, ${y})`,`(${x}, ${y-1})`,`(${y+1}, ${x})`],`Mover hacia arriba aumenta y: ${y}+1=${y+1}.`,gridSvg(x,y),'Arriba y abajo afectan y.');if(k===3)add('coordinates',`¿Qué punto está ${x} unidades a la derecha y ${y} unidades arriba del origen?`,`(${x}, ${y})`,[`(${x+1}, ${y+1})`,`(${x}, ${y+1})`,`(${x+1}, ${y})`],`La posición es (horizontal, vertical), por eso (${x}, ${y}).`,null,'Orden de coordenadas: x primero y después y.');if(k===4)add('coordinates',`Desde el punto (${x}, ${y}), avanza 1 a la derecha y 2 hacia arriba. ¿Cuál es la nueva posición?`,`(${x+1}, ${y+2})`,[`(${x+2}, ${y+1})`,`(${x+1}, ${y+1})`,`(${x}, ${y+2})`],`Sumamos 1 a x y 2 a y: (${x+1}, ${y+2}).`,gridSvg(x,y),'Revisa por separado la horizontal y la vertical.')}
for(let i=0;i<15;i++){let k=i%5,x=1+i%4,y=1+(i%3);if(k===0)add('transform',`Una figura se desplaza ${i+2} cuadros a la derecha sin girar ni voltearse. ¿Qué transformación realizó?`,'Traslación',['Reflexión','Rotación','Ampliación'],`La traslación mueve una figura sin cambiar su orientación, forma ni tamaño.`,null,'Piensa si hubo giro o efecto espejo.');if(k===1)add('transform','Una mariposa aparece como imagen de espejo al otro lado de un eje vertical. ¿Qué transformación es?','Reflexión',['Traslación','Rotación','Reducción'],'La reflexión produce una imagen especular respecto de un eje.',null,'Una imagen de espejo invierte la orientación.');if(k===2)add('transform',`Una flecha gira ${90+((i%2)*90)}° alrededor de un punto fijo. ¿Qué transformación realizó?`,'Rotación',['Reflexión','Traslación','Ampliación'],'La rotación es un giro alrededor de un punto.',null,'Identifica si la figura gira o se desliza.');if(k===3)add('transform',`Traslada el punto (${x}, ${y}) dos cuadros hacia la derecha. ¿Dónde queda?`,`(${x+2}, ${y})`,[`(${x}, ${y+2})`,`(${x+1}, ${y})`,`(${x+2}, ${y+1})`],`En una traslación hacia la derecha aumenta la coordenada x: (${x+2}, ${y}).`,gridSvg(x,y),'Una traslación horizontal cambia x.');if(k===4)add('transform',`¿Qué propiedad se mantiene al reflejar una figura en un eje?`,'Su forma y su tamaño',['Su posición exacta','El sentido izquierda-derecha','Su distancia al origen'],'La reflexión es una transformación isométrica: conserva forma y tamaño.',null,'Piensa en lo que ocurre a una figura real frente a un espejo.')}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function readable(q){return {...q,options:shuffle(q.opts)}}
function save(){try{localStorage.setItem('pdn-obby-save',JSON.stringify({mode,questions:questions.map(q=>({id:q.id,options:q.options})),idx,answers,started,remaining,chosenTopic,feedback,helpLevel}))}catch(e){}}function clearSave(){try{localStorage.removeItem('pdn-obby-save')}catch(e){}}function resume(){try{let s=JSON.parse(localStorage.getItem('pdn-obby-save'));if(!s)return;mode=s.mode;questions=s.questions.map(item=>{let id=typeof item==='string'?item:item.id;let q=bank.find(q=>q.id===id);return q?{...q,options:Array.isArray(item.options)&&item.options.length===4?item.options:shuffle(q.opts)}:null}).filter(Boolean);if(!questions.length)throw Error('Partida sin preguntas');idx=Math.min(s.idx||0,questions.length-1);answers=s.answers||{};started=Date.now();remaining=s.remaining??4200;chosenTopic=s.chosenTopic||'all';screen='quiz';feedback=mode==='training'&&!!answers[questions[idx].id];helpLevel=s.helpLevel||0;draw();if(mode==='exam')timerStart()}catch(e){home()}}
function header(){return `<div class="row between"><span class="tag">🎮 MISIÓN PDN · 5° BÁSICO</span><button class="ghost topbtn" onclick="home()">⌂ Menú</button></div>`}function home(){clearInterval(clock);screen='home';draw()}function setName(v){try{localStorage.setItem('pdn-student',v)}catch(e){}}function getName(){try{return localStorage.getItem('pdn-student')||''}catch(e){return ''}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function start(kind){mode=kind;chosenTopic=$('topicPick')?.value||'all';let sample=chosenTopic==='all'?topics.flatMap(([t])=>shuffle(bank.filter(q=>q.topic===t)).slice(0,6)):shuffle(bank.filter(q=>q.topic===chosenTopic)).slice(0,mode==='exam'?15:12);questions=shuffle(sample).map(readable);answers={};idx=0;remaining=4200;started=Date.now();feedback=false;helpLevel=0;stepsShown=1;screen='quiz';save();draw();if(mode==='exam')timerStart()}function timerStart(){clearInterval(clock);clock=setInterval(()=>{if(screen!=='quiz'||mode!=='exam')return;remaining=Math.max(0,remaining-1);let c=$('clock');if(c)c.textContent=formatTime(remaining);if(!remaining)finish();if(remaining%10===0)save()},1000)}function formatTime(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function showStudy(topic,origin='home'){if(mode==='exam'&&screen==='quiz')return;studyTopic=topic;studyOrigin=origin;stepsShown=1;screen='study';draw()}function backStudy(){screen=studyOrigin==='quiz'?'quiz':'home';draw()}function nextStep(){stepsShown=Math.min(lessons[studyTopic].steps.length,stepsShown+1);draw()}function choose(i){let q=questions[idx];if(mode==='training'&&feedback)return;answers[q.id]=q.options[i];if(mode==='training'){feedback=true;avatarJump=answers[q.id]===q.correct?1:-1;setTimeout(()=>{avatarJump=0},650)}save();draw()}function next(){if(idx<questions.length-1){idx++;feedback=mode==='training'&&!!answers[questions[idx].id];helpLevel=0;save();draw()}else finish()}function prev(){if(idx>0){idx--;feedback=mode==='training'&&!!answers[questions[idx].id];helpLevel=0;save();draw()}}function jump(i){idx=i;feedback=mode==='training'&&!!answers[questions[idx].id];helpLevel=0;save();draw()}function hint(n){helpLevel=n;draw()}function finish(){clearInterval(clock);screen='result';clearSave();draw()}function repeatMistakes(){let wrong=questions.filter(q=>answers[q.id]!==q.correct);if(!wrong.length){start('training');return}let ts=[...new Set(wrong.map(q=>q.topic))],chosen=shuffle(bank.filter(q=>ts.includes(q.topic)&&!questions.some(p=>p.id===q.id))).slice(0,Math.max(5,Math.min(10,wrong.length*2)));if(chosen.length<5)chosen.push(...shuffle(bank.filter(q=>ts.includes(q.topic))).slice(0,5-chosen.length));questions=shuffle(chosen).map(readable);idx=0;mode='training';answers={};feedback=false;helpLevel=0;screen='quiz';save();draw()}
function results(){let right=questions.filter(q=>answers[q.id]===q.correct).length,total=questions.length,wrong=total-right,pct=Math.round(100*right/total);let breakdown=topics.map(([t,name])=>{let qs=questions.filter(q=>q.topic===t);if(!qs.length)return '';let hits=qs.filter(q=>answers[q.id]===q.correct).length;return `<div class="row between light"><span>${name}</span><b>${hits}/${qs.length}</b></div>`}).join('');return `${header()}<div class="center"><div class="character">${pct>=80?'🏆':pct>=60?'⭐':'💪'}</div><h1>¡Misión completada!</h1><p>¡Lo importante es seguir practicando!</p></div><div class="row" style="justify-content:center"><div class="stat">Correctas<strong>${right}</strong></div><div class="stat">Por mejorar<strong>${wrong}</strong></div><div class="stat">Logro<strong>${pct}%</strong></div></div><h3>Tu avance por mundo</h3>${breakdown}<h3>🚦 Semáforo de autoevaluación</h3><div class="grid2"><button class="ghost" onclick="selfEval('🟢 Comprendo y resuelvo solo')">🟢 Verde</button><button class="ghost" onclick="selfEval('🟡 Necesito practicar')">🟡 Amarillo</button><button class="ghost" onclick="selfEval('🔴 Necesito más apoyo')">🔴 Rojo</button></div><p id="evalText" class="small"></p><label><b>¿Qué contenido necesitas reforzar?</b><br><input id="reflection" style="width:100%" placeholder="Escribe tu reflexión"></label><h3>Revisión de preguntas</h3>${questions.map((q,i)=>`<details><summary>${i+1}. ${escapeHtml(q.prompt)} ${answers[q.id]===q.correct?'✅':'📘'}</summary><p>Tu respuesta: <b>${escapeHtml(answers[q.id]||'Sin responder')}</b></p><p>Respuesta correcta: <b>${escapeHtml(q.correct)}</b></p><p>${escapeHtml(q.explain)}</p></details>`).join('')}<div class="row"><button class="blue" onclick="repeatMistakes()">🔄 Practicar mis errores</button><button onclick="downloadCSV()">⬇ Descargar resultados CSV</button><button class="ghost" onclick="home()">Menú principal</button></div>`}
function selfEval(v){let e=$('evalText');if(e)e.textContent='Autoevaluación: '+v}function downloadCSV(){let name=getName();let lines=[['Nombre','Modo','Número','Tema','Pregunta','Respuesta estudiante','Respuesta correcta','Resultado']];questions.forEach((q,i)=>lines.push([name,mode,i+1,lessons[q.topic].title,q.prompt,answers[q.id]||'',q.correct,answers[q.id]===q.correct?'Correcta':'Incorrecta']));let reflection=$('reflection')?.value||'';lines.push(['Reflexión',reflection]);const csv='\ufeff'+lines.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let link=document.createElement('a');link.href=url;link.download='resultado-mision-pdn.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function figure(q){return q.graphic?`<div class="figure svg-wrap">${q.graphic}</div>`:''}function quiz(){let q=questions[idx],response=answers[q.id],right=response===q.correct,done=Object.keys(answers).length;let controls=`<div class="row between"><button class="ghost" onclick="prev()" ${idx===0?'disabled':''}>← Anterior</button><div class="row">${mode==='training'?`<button class="ghost" onclick="showStudy('${q.topic}','quiz')">📚 Ir a estudiar</button>`:''}<button class="blue" onclick="${idx===questions.length-1?'finish()':'next()'}">${idx===questions.length-1?'Finalizar':'Siguiente →'}</button></div></div>`;return `${header()}<div class="row between" style="margin-top:13px"><span class="pill">${mode==='exam'?'📝 Simulacro PDN':'🧩 Entrenamiento'}</span><span class="pill">Pregunta ${idx+1} de ${questions.length}</span>${mode==='exam'?`<span class="pill">⏱ <span id="clock">${formatTime(remaining)}</span></span>`:''}</div><div class="progress" style="margin:13px 0"><div style="width:${100*done/questions.length}%"></div></div><span class="tag">${topics.find(t=>t[0]===q.topic)[1]}</span><div class="question">${escapeHtml(q.prompt)}</div>${figure(q)}<div class="choices">${q.options.map((o,i)=>`<button class="choice ${response===o?'selected':''} ${feedback&&response===o?(right?'correct':'wrong'):''}" onclick="choose(${i})"><span>${'ABCD'[i]}</span>${escapeHtml(o)}</button>`).join('')}</div>${mode==='training'?`<div class="row"><button class="ghost" onclick="hint(${Math.min(helpLevel+1,3)})">💡 Necesito ayuda ${helpLevel?`(${helpLevel}/3)`:''}</button></div>${helpLevel?`<div class="study"><b>💡 Nivel ${helpLevel}</b><p>${helpLevel===1?escapeHtml(lessons[q.topic].definition):helpLevel===2?`Ejemplo diferente: ${escapeHtml(lessons[q.topic].steps.join(' '))}`:escapeHtml(q.hint)}</p></div>`:''}${feedback?`<div class="explain"><b>${right?'✅ ¡Buen trabajo!':'📘 Aprendamos del error'}</b><p>${escapeHtml(q.explain)}</p></div>`:''}`:'<p class="small">En el simulacro no se muestran respuestas ni ayudas durante la prueba. Puedes cambiar tus elecciones antes de finalizar.</p>'}<div class="qnav">${questions.map((p,i)=>`<button class="${i===idx?'current':''} ${answers[p.id]?'done':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div>${controls}<div class="footer">Las preguntas de práctica son nuevas y no revelan la clave de la evaluación original.</div>`}
function study(){let l=lessons[studyTopic];return `${header()}<h2>📚 Academia Matemática</h2><div class="row between"><span class="tag">🤖 PROFE BLOCK: ¡Tú puedes!</span><button class="ghost" onclick="backStudy()">↩ Regresar</button></div><p>Elige un mundo para repasar y luego vuelve a la aventura.</p><div class="row">${topics.map(([id,t])=>`<button class="${id===studyTopic?'blue':'ghost'} topbtn" onclick="showStudy('${id}','${studyOrigin}')">${t}</button>`).join('')}</div><div class="study"><h2>${l.title}</h2><p>${l.definition}</p><p><b>Consejo:</b> ${l.tip}</p></div><h3>✏️ Ejercicio explicado paso a paso</h3>${l.steps.slice(0,stepsShown).map((s,i)=>`<div class="step"><b>Paso ${i+1}.</b> ${s}</div>`).join('')}<div class="row" style="margin-top:13px"><button onclick="nextStep()" ${stepsShown===l.steps.length?'disabled':''}>Ver paso siguiente →</button><button class="ghost" onclick="stepsShown=1;draw()">↶ Volver a explicar</button></div>${stepsShown===l.steps.length?`<div class="explain"><b>¡Ahora inténtalo tú!</b><p>${l.practice}</p></div>`:''}<div class="row"><button class="blue" onclick="backStudy()">🎮 Volver al Obby</button><button class="ghost" onclick="start('training')">Practicar preguntas</button></div>`}
function draw(){gameProgress=screen==='quiz'?idx/(questions.length||1):screen==='result'?1:0;if(screen==='home'){let exists=false;try{exists=!!localStorage.getItem('pdn-obby-save')}catch(e){}panel.innerHTML=`<div class="center"><div class="character">🧱🎮🏆</div><span class="tag">Colegio · Matemática 5° básico</span><h1>MISIÓN PDN</h1><h2>¡El Gran Obby Matemático!</h2><p>Salta entre plataformas, resuelve desafíos y estudia con PROFE BLOCK. ¡Cada respuesta te hace avanzar!</p></div><div class="light"><label><b>Nombre del explorador:</b> <input maxlength="70" value="${escapeHtml(getName())}" oninput="setName(this.value)" placeholder="Tu nombre (opcional)"></label></div><div class="grid2"><div class="card"><h3>🧩 Entrenamiento</h3><p>Practica con ayudas, explicaciones inmediatas y sin límite de tiempo.</p><button class="blue" onclick="start('training')">Jugar y aprender</button></div><div class="card"><h3>📝 Simulacro PDN</h3><p>30 preguntas, 70 minutos y resultados al finalizar, como ensayo de prueba.</p><button onclick="start('exam')">Iniciar simulacro</button></div></div><div class="light"><label><b>Seleccionar mundo:</b> <select id="topicPick"><option value="all">🌎 Todos los mundos (recomendado)</option>${topics.map(([id,name])=>`<option value="${id}">${name}</option>`).join('')}</select></label><p class="small">El simulacro completo de 30 preguntas usa la opción «Todos los mundos». Al elegir uno solo, es una práctica temática más corta.</p></div><div class="row"><button class="ghost" onclick="showStudy('fractions','home')">📚 Entrar a la Academia</button>${exists?'<button class="ghost" onclick="resume()">▶ Continuar partida</button>':''}</div><p class="footer">Juego original inspirado en aventuras de plataformas tipo Obby · Funciona sin internet · ${bank.length} preguntas originales</p>`}else if(screen==='quiz')panel.innerHTML=quiz();else if(screen==='study')panel.innerHTML=study();else if(screen==='result')panel.innerHTML=results()}
// Escenario animado de plataformas con perspectiva y avatar original estilo blocky.
const canvas=$('scene'),ctx=canvas.getContext('2d');let W=0,H=0,t=0;function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();function polygon(points,fill,stroke){ctx.beginPath();ctx.moveTo(...points[0]);points.slice(1).forEach(p=>ctx.lineTo(...p));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}function avatar(x,y,s=1){ctx.save();ctx.translate(x,y+Math.sin(t*2)*3-(avatarJump>0?17:avatarJump<0?-11:0));ctx.scale(s,s);ctx.fillStyle='#24336c';ctx.fillRect(-13,19,11,22);ctx.fillRect(3,19,11,22);ctx.fillStyle='#28b48b';ctx.fillRect(-22,-11,44,34);ctx.fillStyle='#f3bd7a';ctx.fillRect(-34,-8,12,29);ctx.fillRect(22,-8,12,29);ctx.fillRect(-17,-39,34,30);ctx.fillStyle='#343c53';ctx.fillRect(-7,-25,4,4);ctx.fillRect(7,-25,4,4);ctx.restore()}function renderScene(){t+=.012;let w=innerWidth,h=innerHeight;let grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#69bafd');grad.addColorStop(.75,'#c4e8ff');grad.addColorStop(1,'#f7faff');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);for(let i=0;i<9;i++){let xx=((i*239+t*(8+i%4))%(w+280))-140,yy=36+(i*103)%(h*.54);ctx.fillStyle='#ffffffaa';ctx.beginPath();ctx.ellipse(xx,yy,65,19,0,0,Math.PI*2);ctx.ellipse(xx+35,yy-11,35,25,0,0,Math.PI*2);ctx.ellipse(xx-24,yy-10,30,22,0,0,Math.PI*2);ctx.fill()}for(let i=0;i<8;i++){let depth=i/8,px=w*.11+depth*w*.87,py=h*.77-depth*h*.52+Math.sin(t+i)*5;let s=1.15-depth*.6;polygon([[px-76*s,py],[px+76*s,py],[px+45*s,py+37*s],[px-104*s,py+37*s]],['#79d989','#ffdc72','#a97bf0','#6bd7ed'][i%4]);polygon([[px-104*s,py+37*s],[px+45*s,py+37*s],[px+45*s,py+54*s],[px-104*s,py+54*s]],'#4875a5');polygon([[px+45*s,py+37*s],[px+76*s,py],[px+76*s,py+16*s],[px+45*s,py+54*s]],'#335c93')}avatar(w*.11,h*.72,.9);requestAnimationFrame(renderScene)}requestAnimationFrame(renderScene);draw();
</script></body></html>
