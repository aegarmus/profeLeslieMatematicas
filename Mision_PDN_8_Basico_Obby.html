<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misión PDN | Obby Algebraico 8°</title><style>
:root{--ink:#182643;--blue:#3768e9;--yellow:#ffda56;--green:#35c88b;--white:#fff;--pink:#ff6fa6}*{box-sizing:border-box}body{margin:0;background:#a5dcff;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}button,select,input{font:inherit}button{cursor:pointer;border:0;border-radius:13px;font-weight:800;padding:12px 18px;background:var(--yellow);color:#262849;box-shadow:0 5px 0 #c39c23;transition:transform .12s}button:hover{filter:brightness(1.04);transform:translateY(-2px)}button:disabled{filter:grayscale(.65);cursor:not-allowed;opacity:.65}button:active{transform:translateY(3px)}button.blue{background:#5279f5;color:white;box-shadow:0 5px 0 #2846ab}button.ghost{background:#fff;color:#24416f;box-shadow:0 4px 0 #b9ccda}button.red{background:#ffb3b8;box-shadow:0 4px 0 #d77782}.hidden{display:none!important}#scene{position:fixed;inset:0;width:100vw;height:100vh;z-index:0}#app{position:relative;min-height:100vh;z-index:1;display:flex;align-items:center;justify-content:center;padding:18px}#panel{width:min(900px,100%);max-height:calc(100vh - 36px);overflow-y:auto;background:rgba(255,255,255,.96);border:4px solid #fff;border-radius:24px;box-shadow:0 18px 65px #17417766;padding:clamp(17px,3vw,31px)}h1{font-size:clamp(28px,5vw,48px);margin:8px 0;line-height:1.1}h2{font-size:clamp(23px,3vw,31px);margin:8px 0}h3{margin:10px 0}p{line-height:1.5}.small{font-size:13px;color:#5d6780}.tag{display:inline-block;background:#e8efff;color:#2646a4;border-radius:50px;padding:5px 12px;font-weight:800;font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}.center{text-align:center}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#edf4ff;border:2px solid #cddbf7;border-radius:17px;padding:17px}.card h3{margin-top:0}.pill{background:#eef1fc;padding:8px 11px;border-radius:99px;font-weight:800;font-size:13px}.progress{height:14px;border-radius:99px;overflow:hidden;background:#d9e4fb}.progress>div{height:100%;background:linear-gradient(90deg,#38bb8d,#83d65d);transition:width .3s}.question{font-size:clamp(19px,2.7vw,27px);font-weight:850;margin:18px 0 10px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0}.choice{display:flex;text-align:left;align-items:center;gap:11px;min-height:68px;background:#f5f8ff;box-shadow:none;border:2px solid #b8c8e9;color:#243357}.choice span{background:#dce7ff;padding:8px 12px;border-radius:9px}.choice.selected{border:3px solid #406aff;background:#e5ecff}.choice.correct{border:3px solid #25b873;background:#e3f9ec}.choice.wrong{border:3px solid #ea6874;background:#fff0f0}.study{border-left:6px solid #5c87e8;background:#eef4ff;border-radius:12px;padding:14px 17px;margin:12px 0}.explain{background:#fff6d5;border-left:6px solid #f3bc37;border-radius:12px;padding:14px 17px;margin:12px 0}.figure{margin:15px auto;max-width:480px}.figure svg{width:100%;max-height:210px}.character{font-size:64px}.topic{font-size:16px}.step{background:white;padding:12px;margin-top:9px;border-radius:11px;border:1px solid #d6def0}.topbtn{font-size:13px;padding:8px 10px}.light{background:#f6faff;padding:15px;border-radius:15px;margin:12px 0}.warn{background:#fff0da;border:1px solid #efce95;border-radius:12px;padding:10px}.qnav{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:12px 0}.qnav button{padding:8px 0;border-radius:7px;background:#dde8fa;box-shadow:none;font-size:12px}.qnav button.current{background:#fbd058}.qnav button.done{background:#85dfb9}.stat{background:#edf4ff;border-radius:12px;padding:10px;text-align:center;min-width:110px}.stat strong{display:block;font-size:24px}details{background:#f1f5fc;border-radius:10px;padding:12px;margin:8px 0}summary{cursor:pointer;font-weight:800}.svg-wrap{display:flex;justify-content:center}.footer{margin-top:17px;font-size:12px;color:#65728b;text-align:center}select,input{border:2px solid #b5c9f1;padding:11px;border-radius:10px;max-width:100%}@media(max-width:630px){.choices,.grid2{grid-template-columns:1fr}#app{padding:8px;align-items:flex-start}#panel{max-height:none;padding:15px}.qnav{grid-template-columns:repeat(6,1fr)}}
</style></head><body><canvas id="scene" aria-hidden="true"></canvas><main id="app"><section id="panel" aria-live="polite"></section></main><script>
'use strict';
const $=x=>document.getElementById(x), panel=$('panel');let screen='home',mode='training',chosenTopic='all',questions=[],idx=0,answers={},helpLevel=0,started=0,remaining=4200,clock=null,feedback=false,stepsShown=1,studyTopic='products',studyOrigin='home',gameProgress=0,avatarJump=0,score=0;
const topics=[['products','🧱 Torre de productos algebraicos'],['factor','💎 Minas de factorización'],['concept','🤖 Laboratorio de funciones'],['linear','🚀 Pista de función lineal'],['affine','🌌 Ciudad de gráficos afines']];
const lessons={
products:{title:'Multiplicación de expresiones algebraicas',definition:'Usa la propiedad distributiva: multiplica cada término de un paréntesis por todos los del otro. Después reduce términos semejantes.',steps:['Ejemplo: (x + 2)(x + 5).','Multiplica cada término: x² + 5x + 2x + 10.','Reúne términos semejantes: x² + 7x + 10.'],tip:'No olvides los productos cruzados. Para áreas de rectángulos, multiplica largo por ancho.',practice:'Practica (x + 3)(x + 4) y comprueba que resulta x² + 7x + 12.'},
factor:{title:'Factor común y factorización',definition:'Factorizar es escribir una expresión como un producto. Busca primero el factor que aparece en todos los términos.',steps:['Ejemplo: factoriza 8x + 12.','El factor común de 8 y 12 es 4.','Saca 4 como factor: 4(2x + 3).'],tip:'Comprueba distribuyendo el factor de nuevo. Una expresión factorizada debe producir exactamente la original.',practice:'Factoriza 6x + 15: corresponde a 3(2x + 5).'},
concept:{title:'¿Qué es una función?',definition:'Una función asigna a cada entrada x exactamente una salida y. Se escribe y=f(x). La imagen de x es el resultado que entrega la regla.',steps:['Ejemplo: f(x)=2x+3. ¿Cuál es la imagen de 4?','Sustituye x por 4: f(4)=2·4+3.','Calcula f(4)=11.'],tip:'Una misma entrada no puede tener dos salidas diferentes. Entradas distintas sí pueden compartir una salida.',practice:'Si f(x)=3x+1, la imagen de 2 es 7.'},
linear:{title:'Función lineal y proporcionalidad directa',definition:'La función lineal tiene forma f(x)=mx y pasa por el origen (0,0). En una tabla proporcional, la razón y/x es constante para x≠0.',steps:['Ejemplo: la tabla contiene (2,6) y (5,15).','Calcula la razón: 6/2=3 y 15/5=3.','Entonces m=3 y la regla es f(x)=3x.'],tip:'Si la relación es de proporcionalidad directa, cuando x=0, y=0.',practice:'En y=4x, la imagen de 3 es 12.'},
affine:{title:'Función afín, pendiente y gráficos',definition:'Una función afín tiene forma f(x)=mx+b. La pendiente m indica cuánto cambia y por cada unidad de x; b es la intersección con el eje vertical.',steps:['Ejemplo: una recta pasa por (0,2) y (2,8).','La pendiente es (8−2)/(2−0)=3.','Como corta el eje y en 2, la función es f(x)=3x+2.'],tip:'Pendiente positiva: recta creciente. Pendiente negativa: decreciente. Si b=0, es de proporcionalidad directa.',practice:'Una recta con pendiente −2 e intersección vertical 5 corresponde a f(x)=−2x+5.'}
};
let bank=[];
function add(topic,prompt,answer,wrong,explain,graphic=null,hint='Identifica qué procedimiento corresponde y comprueba el resultado.'){
 let opts=[String(answer),...wrong.map(String)]; for(let i=1;i<4;i++){if(opts.slice(0,i).includes(opts[i])){let n=Number(opts[i]);if(Number.isFinite(n)){let j=1;while(opts.slice(0,i).includes(String(n+j)))j++;opts[i]=String(n+j)}else throw Error('Alternativas duplicadas en: '+prompt+': '+opts)}}bank.push({id:'8q'+bank.length,topic,prompt,correct:String(answer),opts,explain,graphic,hint});
}
function fmt(n){return n<0?'−'+Math.abs(n):String(n)}
function plus(n){return n<0?' − '+Math.abs(n):' + '+n}
function quad(a,b,c){let s=(a===1?'':a)+'x²'; if(b!==0)s+=b<0?' − '+Math.abs(b)+'x':' + '+b+'x';if(c!==0)s+=plus(c);return s}
function lin(a,b){return (a===1?'':a===-1?'−':fmt(a))+'x'+(b===0?'':plus(b))}
function xygraph(m,b,lines=1){let size=280,unit=24,c=140;let grid='';for(let k=-5;k<=5;k++){let v=c+k*unit;grid+=`<path d="M${v} 16V264 M16 ${v}H264" stroke="#d6e3f4" stroke-width="1"/>`}let path=(mm,bb,color)=>{let x1=-5,x2=5;return `<path d="M${c+x1*unit} ${c-(mm*x1+bb)*unit} L${c+x2*unit} ${c-(mm*x2+bb)*unit}" stroke="${color}" stroke-width="3.5" fill="none"/>`};return `<svg viewBox="0 0 280 280" role="img" aria-label="Plano cartesiano con recta representada">${grid}<path d="M140 16V264 M16 140H264" stroke="#334d70" stroke-width="2.5"/>${path(m,b,'#f04f78')}<text x="246" y="155" font-size="14">x</text><text x="150" y="25" font-size="14">y</text><circle cx="140" cy="${c-b*unit}" r="4" fill="#153e73"/><text x="149" y="${c-b*unit-6}" font-size="13">${fmt(b)}</text></svg>`}
function tableSvg(xs,ys){return `<svg viewBox="0 0 400 105" role="img" aria-label="Tabla de valores x e y"><rect x="5" y="5" width="390" height="95" rx="8" fill="#edf5ff" stroke="#486a9d"/>${[1,2,3,4].map(k=>`<path d="M${k*78+5} 5V100" stroke="#728cad"/>`).join('')}<path d="M5 52H395" stroke="#728cad"/><text x="27" y="34" font-weight="bold">x</text><text x="27" y="82" font-weight="bold">y</text>${xs.map((v,i)=>`<text x="${98+i*78}" y="34" font-size="18">${v}</text><text x="${98+i*78}" y="82" font-size="18">${ys[i]}</text>`).join('')}</svg>`}
function mappingSvg(valid){let left=[1,2,3], right=[3,6,9], arrows=valid?[[0,0],[1,1],[2,2]]:[[0,0],[0,1],[1,1],[2,2]];return `<svg viewBox="0 0 390 175" role="img" aria-label="Diagrama de relación de entradas y salidas"><rect x="14" y="10" width="110" height="157" rx="50" fill="#e6f0ff" stroke="#4a6b9d"/><rect x="270" y="10" width="110" height="157" rx="50" fill="#dff8ee" stroke="#4a9c85"/>${left.map((v,i)=>`<text x="60" y="${48+i*46}" font-size="23">${v}</text><text x="319" y="${48+i*46}" font-size="23">${right[i]}</text>`).join('')}<defs><marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="#3f6797"/></marker></defs>${arrows.map(([i,j])=>`<path d="M83 ${41+i*46}L300 ${41+j*46}" stroke="#3f6797" stroke-width="2" marker-end="url(#arr)"/>`).join('')}</svg>`}
// Productos y áreas algebraicas: 20 ejercicios.
for(let i=0;i<20;i++){let a=2+i%5,b=3+(i*2)%7,k=i%4;
 if(k===0){let right=quad(1,a+b,a*b);add('products',`Desarrolla y reduce: (x + ${a})(x + ${b}).`,right,[quad(1,a*b,a+b),quad(1,a+b+1,a*b),quad(1,a+b,a*b+1)],`Aplicamos distributiva: x² + ${b}x + ${a}x + ${a*b} = ${right}.`,null,'Multiplica los cuatro pares de términos.');}
 if(k===1){let m=2+i%4;let right=quad(m,m*b,0);add('products',`¿Cuál es el producto desarrollado de ${m}x(x + ${b})?`,right,[quad(m,m+b,0),quad(m,m*b+1,0),quad(m+1,m*b,0)],`Multiplica ${m}x por cada término: ${m}x·x=${m}x² y ${m}x·${b}=${m*b}x.`,null,'Distribuye el monomio a ambos términos.');}
 if(k===2){let right=quad(1,b-a,-a*b);add('products',`Un rectángulo tiene lados (x − ${a}) y (x + ${b}). ¿Qué expresión representa su área desarrollada?`,right,[quad(1,b+a,-a*b),quad(1,b-a,a*b),quad(1,b-a+1,-a*b)],`Área = largo × ancho: x² + ${b}x − ${a}x − ${a*b} = ${right}.`,null,'Recuerda multiplicar ambos binomios, cuidando el signo negativo.');}
 if(k===3){let right=quad(1,2*a,a*a);add('products',`Al desarrollar (x + ${a})² se obtiene:`,right,[quad(1,a,a*a),quad(1,2*a,a*a+a),quad(1,2*a+1,a*a)],`(x + ${a})² = (x + ${a})(x + ${a}); el término central es ${a}x + ${a}x.`,null,'Un cuadrado de binomio incluye dos productos cruzados.');}
}
// Factorización: 20 ejercicios.
for(let i=0;i<20;i++){let a=2+i%6,b=2+(i*3)%7,c=2+(i*5)%8,k=i%4;
 if(k===0){let right=`${a}(${b}x + ${c})`;add('factor',`Factoriza ${a*b}x + ${a*c} usando factor común.`,right,[`${b+1}(${a}x + ${c})`,`${a}(${b}x − ${c})`,`${a}(${b+1}x + ${c})`],`Ambos términos son múltiplos de ${a}; al dividir resulta ${b}x + ${c}.`,null,'Busca un número que divida ambos coeficientes.');}
 if(k===1){let right=`x(x + ${a})`;add('factor',`¿Cuál es la forma factorizada de x² + ${a}x?`,right,[`x(x + ${a+1})`,`x²(1 + ${a})`,`x(x − ${a})`],`El factor común es x: x² + ${a}x = x(x + ${a}).`,null,'La x aparece en ambos términos.');}
 if(k===2){let right=`(x + ${a})(x + ${b})`;let target=quad(1,a+b,a*b);add('factor',`¿Qué producto equivale a ${target}?`,right,[`(x + ${a+1})(x + ${b})`,`(x − ${a})(x + ${b})`,`(x + ${a})(x − ${b})`],`Los números deben sumar ${a+b} y multiplicar ${a*b}.`,null,'Busca dos números cuya suma y producto coincidan con los coeficientes.');}
 if(k===3){let right=`${a}x(${b}x + ${c})`;add('factor',`Factoriza ${a*b}x² + ${a*c}x.`,right,[`${a}(${b}x + ${c})`,`${a}x(${b}x − ${c})`,`${a}x(${b+1}x + ${c})`],`El factor común es ${a}x; al distribuir se recuperan los dos términos originales.`,null,'Extrae el factor numérico y la variable común.');}
}
// Concepto y evaluación de funciones: 20 ejercicios.
for(let i=0;i<20;i++){let m=2+i%5,b=(i%7)-3,x=2+i%4,k=i%5;
 if(k===0){let y=m*x+b;add('concept',`Sea f(x)=${lin(m,b)}. ¿Cuál es la imagen de ${x}?`,y,[y+m,y+2*m+1,y-1],`Reemplazamos x=${x}: f(${x})=${m}·${x}${b<0?' − '+(-b):' + '+b}=${y}.`,null,'Sustituye x por el número dado y calcula.');}
 if(k===1){let y=m*x+b;add('concept',`La función f(x)=${lin(m,b)} entrega ${y}. ¿Cuál fue la entrada x?`,x,[x+1,x-1,x+2],`Resolvemos ${m}x${b<0?' − '+(-b):' + '+b}=${y}; al despejar obtenemos x=${x}.`,null,'Plantea una ecuación con la salida conocida.');}
 if(k===2){let y=m*x+b;add('concept',`¿Qué par ordenado pertenece a y=${lin(m,b)}?`,`(${x}, ${y})`,[`(${x}, ${y+1})`,`(${x+1}, ${y})`,`(${x-1}, ${y})`],`Con x=${x} se obtiene y=${m}·${x}${b<0?' − '+(-b):' + '+b}=${y}, por lo tanto (${x}, ${y}) sí pertenece.`,null,'Reemplaza la primera coordenada y compara con la segunda.');}
 if(k===3){let v=i%2===0;add('concept',`Observa la relación de entradas y salidas. ¿Cuál afirmación es correcta?`,v?'Sí es función porque cada entrada tiene una sola salida.':'No es función porque una entrada tiene dos salidas diferentes.',v?['No es función porque dos salidas pueden ser distintas.','No es función porque las entradas deben coincidir.','Sí es función porque todas las salidas son iguales.']:['Sí es función porque todas las entradas se conectan.','Sí es función porque las salidas pueden repetirse.','No es función porque cada salida tiene que ser 0.'],v?'Las tres entradas tienen exactamente una imagen.':'La entrada 1 tiene dos imágenes; eso contradice la definición de función.',mappingSvg(v),'Cuenta cuántas salidas tiene cada entrada, no cuántas entradas llegan a una salida.');}
 if(k===4){let r=m*x+b;add('concept',`Una máquina multiplica la entrada por ${m} y luego ${b>=0?'suma '+b:'resta '+(-b)}. ¿Cuál es su regla?`,`f(x)=${lin(m,b)}`,[`f(x)=${lin(m,b+1)}`,`f(x)=${lin(m+1,b)}`,`f(x)=${lin(m,-b||1)}`],`La operación es multiplicar por ${m} y luego ajustar ${fmt(b)}; por eso f(x)=${lin(m,b)}.`,null,'Primero se multiplica la entrada y después se aplica el cambio fijo.');}
}
// Proporcionalidad y función lineal: 20 ejercicios.
for(let i=0;i<20;i++){let m=2+i%6,x=2+i%4,k=i%5;
 if(k===0){let xs=[1,2,3,4],ys=xs.map(z=>z*m);add('linear','Observa la tabla de proporcionalidad directa. ¿Qué función representa los datos?',`f(x)=${m}x`,[`f(x)=${m+1}x`,`f(x)=x + ${m}`,`f(x)=${m}x + 2`],`La razón y/x es ${m} en todas las columnas. Por eso f(x)=${m}x.`,tableSvg(xs,ys),'Divide y por x en dos columnas y compara.');}
 if(k===1){add('linear',`La función lineal f(x)=${m}x. ¿Cuál es su imagen para x=${x}?`,m*x,[m+x,m*x+m,m*x-1],`f(${x})=${m}·${x}=${m*x}.`,null,'En una función lineal multiplica la entrada por la pendiente.');}
 if(k===2){add('linear',`¿Cuál de las siguientes reglas representa proporcionalidad directa?`,`f(x)=${m}x`,[`f(x)=${m}x + 1`,`f(x)=${m}x − 2`,`f(x)=${m}x + ${m}`],`Una proporcionalidad directa tiene la forma f(x)=mx y pasa por (0,0).`,null,'Comprueba si la función vale cero cuando x vale cero.');}
 if(k===3){let m2=m+1;add('linear',`Si una relación cumple y=${m}x, ¿qué ocurre con y cuando x aumenta 3 unidades?`,`Aumenta ${3*m} unidades`,[`Aumenta ${m} unidades`,`Aumenta ${m+2} unidades`,`Aumenta ${3*m2} unidades`],`Cada unidad extra de x agrega ${m} a y; tres unidades agregan 3·${m}=${3*m}.`,null,'La pendiente indica el cambio por una unidad de entrada.');}
 if(k===4){let right=`(${x}, ${m*x})`;add('linear',`¿Cuál de estos puntos pertenece a la función f(x)=${m}x?`,right,[`(${x}, ${m*x+1})`,`(${x+1}, ${m*x})`,`(${x-1}, ${m*x})`],`Sustituyendo x=${x}, resulta f(${x})=${m*x}; el par es ${right}.`,xygraph(m,0),'La gráfica de y=mx siempre pasa por el origen.');}
}
// Función afín, pendiente y gráficos: 25 ejercicios.
for(let i=0;i<25;i++){let m=(i%2===0?1:-1)*(1+i%3),b=(i%5)+1,x=1+i%3,k=i%5;
 if(k===0){let answer=`f(x)=${lin(m,b)}`;add('affine',`Observa la recta. ¿Qué función afín representa?`,answer,[`f(x)=${lin(-m,b)}`,`f(x)=${lin(m,b+1)}`,`f(x)=${lin(m,-b)}`],`La recta corta el eje vertical en ${b} y su pendiente es ${fmt(m)}; por tanto, ${answer}.`,xygraph(m,b),'Identifica primero la intersección vertical y luego si la recta crece o decrece.');}
 if(k===1){let answer=m;add('affine',`La función f(x)=${lin(m,b)} tiene pendiente:`,answer,[b,-m-1,m+1],`En f(x)=mx+b, la pendiente es el coeficiente de x, que aquí es ${fmt(m)}.`,null,'Busca el número que multiplica a x.');}
 if(k===2){let xs=[0,1,2,3],ys=xs.map(z=>m*z+b);add('affine',`La tabla representa una función afín. ¿Cuál es su pendiente?`,m,[b,m+1,m-1],`Por cada aumento de 1 en x, y cambia ${fmt(m)}. La pendiente es ${fmt(m)}.`,tableSvg(xs,ys),'Compara los cambios de x e y, no solo un valor aislado de y.');}
 if(k===3){let rate=200+(i%4)*100,fixed=800+(i%5)*200;let answer=`C(x)=${rate}x + ${fixed}`;add('affine',`Un servicio cobra $${fixed} fijos y $${rate} por kilómetro. Si x son los kilómetros, ¿qué función modela el costo?`,answer,[`C(x)=${fixed}x + ${rate}`,`C(x)=${rate}x`,`C(x)=${rate}x − ${fixed}`],`El costo total es cobro variable ${rate}·x más cargo fijo ${fixed}.`,null,'Distingue tarifa fija y costo por kilómetro.');}
 if(k===4){let limit=15+i%5;add('affine',`Una empresa usa C(x)=${120*i+500} + ${150+i*10}x únicamente para viajes de hasta ${limit} km. ¿Qué afirmación es válida?`,`El modelo se usa hasta ${limit} km; no está validado para viajes mayores.`,[`Se puede aplicar con certeza a cualquier distancia.`,`Solo se puede aplicar exactamente a ${limit} km.`,`No es una función porque existe un costo fijo.`],`El dominio declarado limita la validez del modelo; no podemos extrapolar con certeza más allá de ${limit} km.`,null,'Lee la restricción de uso del modelo, no solo su fórmula.');}
}
// Argumentación adicional, inspirada en problemas de detección de errores.
for(let j=0;j<5;j++){let a=2+j,b=3+j;add('products',`Un estudiante afirma que (x + ${a})(x + ${b}) = x² + ${a*b}. ¿Cuál es el error?`,'Omitió los productos cruzados entre los términos.', ['Solo debería multiplicar los términos constantes.','La variable x debe desaparecer en el producto.','Las constantes siempre deben restarse.'],`La distributiva exige cuatro productos: x² + ${b}x + ${a}x + ${a*b}.` ,null,'Piensa cuántos productos se forman al multiplicar dos binomios.');}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function readable(q){return {...q,options:shuffle(q.opts)}}
function save(){try{localStorage.setItem('pdn-obby-8-save',JSON.stringify({mode,questions:questions.map(q=>({id:q.id,options:q.options})),idx,answers,started,remaining,chosenTopic,feedback,helpLevel}))}catch(e){}}function clearSave(){try{localStorage.removeItem('pdn-obby-8-save')}catch(e){}}function resume(){try{let s=JSON.parse(localStorage.getItem('pdn-obby-8-save'));if(!s)return;mode=s.mode;questions=s.questions.map(item=>{let id=typeof item==='string'?item:item.id;let q=bank.find(q=>q.id===id);return q?{...q,options:Array.isArray(item.options)&&item.options.length===4?item.options:shuffle(q.opts)}:null}).filter(Boolean);if(!questions.length)throw Error('Partida sin preguntas');idx=Math.min(s.idx||0,questions.length-1);answers=s.answers||{};started=Date.now();remaining=s.remaining??4200;chosenTopic=s.chosenTopic||'all';screen='quiz';feedback=mode==='training'&&!!answers[questions[idx].id];helpLevel=s.helpLevel||0;draw();if(mode==='exam')timerStart()}catch(e){home()}}
function header(){return `<div class="row between"><span class="tag">🎮 MISIÓN PDN · 8° BÁSICO</span><button class="ghost topbtn" onclick="home()">⌂ Menú</button></div>`}function home(){clearInterval(clock);screen='home';draw()}function setName(v){try{localStorage.setItem('pdn-student',v)}catch(e){}}function getName(){try{return localStorage.getItem('pdn-student')||''}catch(e){return ''}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function start(kind){mode=kind;chosenTopic=$('topicPick')?.value||'all';let sample=chosenTopic==='all'?topics.flatMap(([t])=>shuffle(bank.filter(q=>q.topic===t)).slice(0,6)):shuffle(bank.filter(q=>q.topic===chosenTopic)).slice(0,mode==='exam'?15:12);questions=shuffle(sample).map(readable);answers={};idx=0;remaining=4200;started=Date.now();feedback=false;helpLevel=0;stepsShown=1;screen='quiz';save();draw();if(mode==='exam')timerStart()}function timerStart(){clearInterval(clock);clock=setInterval(()=>{if(screen!=='quiz'||mode!=='exam')return;remaining=Math.max(0,remaining-1);let c=$('clock');if(c)c.textContent=formatTime(remaining);if(!remaining)finish();if(remaining%10===0)save()},1000)}function formatTime(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function showStudy(topic,origin='home'){if(mode==='exam'&&screen==='quiz')return;studyTopic=topic;studyOrigin=origin;stepsShown=1;screen='study';draw()}function backStudy(){screen=studyOrigin==='quiz'?'quiz':'home';draw()}function nextStep(){stepsShown=Math.min(lessons[studyTopic].steps.length,stepsShown+1);draw()}function choose(i){let q=questions[idx];if(mode==='training'&&feedback)return;answers[q.id]=q.options[i];if(mode==='training'){feedback=true;avatarJump=answers[q.id]===q.correct?1:-1;setTimeout(()=>{avatarJump=0},650)}save();draw()}function next(){if(idx<questions.length-1){idx++;feedback=mode==='training'&&!!answers[questions[idx].id];helpLevel=0;save();draw()}else finish()}function prev(){if(idx>0){idx--;feedback=mode==='training'&&!!answers[questions[idx].id];helpLevel=0;save();draw()}}function jump(i){idx=i;feedback=mode==='training'&&!!answers[questions[idx].id];helpLevel=0;save();draw()}function hint(n){helpLevel=n;draw()}function finish(){clearInterval(clock);screen='result';clearSave();draw()}function repeatMistakes(){let wrong=questions.filter(q=>answers[q.id]!==q.correct);if(!wrong.length){start('training');return}let ts=[...new Set(wrong.map(q=>q.topic))],chosen=shuffle(bank.filter(q=>ts.includes(q.topic)&&!questions.some(p=>p.id===q.id))).slice(0,Math.max(5,Math.min(10,wrong.length*2)));if(chosen.length<5)chosen.push(...shuffle(bank.filter(q=>ts.includes(q.topic))).slice(0,5-chosen.length));questions=shuffle(chosen).map(readable);idx=0;mode='training';answers={};feedback=false;helpLevel=0;screen='quiz';save();draw()}
function results(){let right=questions.filter(q=>answers[q.id]===q.correct).length,total=questions.length,wrong=total-right,pct=Math.round(100*right/total);let breakdown=topics.map(([t,name])=>{let qs=questions.filter(q=>q.topic===t);if(!qs.length)return '';let hits=qs.filter(q=>answers[q.id]===q.correct).length;return `<div class="row between light"><span>${name}</span><b>${hits}/${qs.length}</b></div>`}).join('');return `${header()}<div class="center"><div class="character">${pct>=80?'🏆':pct>=60?'⭐':'💪'}</div><h1>¡Misión completada!</h1><p>¡Lo importante es seguir practicando!</p></div><div class="row" style="justify-content:center"><div class="stat">Correctas<strong>${right}</strong></div><div class="stat">Por mejorar<strong>${wrong}</strong></div><div class="stat">Logro<strong>${pct}%</strong></div></div><h3>Tu avance por mundo</h3>${breakdown}<h3>🚦 Semáforo de autoevaluación</h3><div class="grid2"><button class="ghost" onclick="selfEval('🟢 Comprendo y resuelvo solo')">🟢 Verde</button><button class="ghost" onclick="selfEval('🟡 Necesito practicar')">🟡 Amarillo</button><button class="ghost" onclick="selfEval('🔴 Necesito más apoyo')">🔴 Rojo</button></div><p id="evalText" class="small"></p><label><b>¿Qué contenido necesitas reforzar?</b><br><input id="reflection" style="width:100%" placeholder="Escribe tu reflexión"></label><h3>Revisión de preguntas</h3>${questions.map((q,i)=>`<details><summary>${i+1}. ${escapeHtml(q.prompt)} ${answers[q.id]===q.correct?'✅':'📘'}</summary><p>Tu respuesta: <b>${escapeHtml(answers[q.id]||'Sin responder')}</b></p><p>Respuesta correcta: <b>${escapeHtml(q.correct)}</b></p><p>${escapeHtml(q.explain)}</p></details>`).join('')}<div class="row"><button class="blue" onclick="repeatMistakes()">🔄 Practicar mis errores</button><button onclick="downloadCSV()">⬇ Descargar resultados CSV</button><button class="ghost" onclick="home()">Menú principal</button></div>`}
function selfEval(v){let e=$('evalText');if(e)e.textContent='Autoevaluación: '+v}function downloadCSV(){let name=getName();let lines=[['Nombre','Modo','Número','Tema','Pregunta','Respuesta estudiante','Respuesta correcta','Resultado']];questions.forEach((q,i)=>lines.push([name,mode,i+1,lessons[q.topic].title,q.prompt,answers[q.id]||'',q.correct,answers[q.id]===q.correct?'Correcta':'Incorrecta']));let reflection=$('reflection')?.value||'';lines.push(['Reflexión',reflection]);const csv='\ufeff'+lines.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let link=document.createElement('a');link.href=url;link.download='resultado-mision-pdn.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function figure(q){return q.graphic?`<div class="figure svg-wrap">${q.graphic}</div>`:''}function quiz(){let q=questions[idx],response=answers[q.id],right=response===q.correct,done=Object.keys(answers).length;let controls=`<div class="row between"><button class="ghost" onclick="prev()" ${idx===0?'disabled':''}>← Anterior</button><div class="row">${mode==='training'?`<button class="ghost" onclick="showStudy('${q.topic}','quiz')">📚 Ir a estudiar</button>`:''}<button class="blue" onclick="${idx===questions.length-1?'finish()':'next()'}">${idx===questions.length-1?'Finalizar':'Siguiente →'}</button></div></div>`;return `${header()}<div class="row between" style="margin-top:13px"><span class="pill">${mode==='exam'?'📝 Simulacro PDN':'🧩 Entrenamiento'}</span><span class="pill">Pregunta ${idx+1} de ${questions.length}</span>${mode==='exam'?`<span class="pill">⏱ <span id="clock">${formatTime(remaining)}</span></span>`:''}</div><div class="progress" style="margin:13px 0"><div style="width:${100*done/questions.length}%"></div></div><span class="tag">${topics.find(t=>t[0]===q.topic)[1]}</span><div class="question">${escapeHtml(q.prompt)}</div>${figure(q)}<div class="choices">${q.options.map((o,i)=>`<button class="choice ${response===o?'selected':''} ${feedback&&response===o?(right?'correct':'wrong'):''}" onclick="choose(${i})"><span>${'ABCD'[i]}</span>${escapeHtml(o)}</button>`).join('')}</div>${mode==='training'?`<div class="row"><button class="ghost" onclick="hint(${Math.min(helpLevel+1,3)})">💡 Necesito ayuda ${helpLevel?`(${helpLevel}/3)`:''}</button></div>${helpLevel?`<div class="study"><b>💡 Nivel ${helpLevel}</b><p>${helpLevel===1?escapeHtml(lessons[q.topic].definition):helpLevel===2?`Ejemplo diferente: ${escapeHtml(lessons[q.topic].steps.join(' '))}`:escapeHtml(q.hint)}</p></div>`:''}${feedback?`<div class="explain"><b>${right?'✅ ¡Buen trabajo!':'📘 Aprendamos del error'}</b><p>${escapeHtml(q.explain)}</p></div>`:''}`:'<p class="small">En el simulacro no se muestran respuestas ni ayudas durante la prueba. Puedes cambiar tus elecciones antes de finalizar.</p>'}<div class="qnav">${questions.map((p,i)=>`<button class="${i===idx?'current':''} ${answers[p.id]?'done':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div>${controls}<div class="footer">Las preguntas de práctica son nuevas y no revelan la clave de la evaluación original.</div>`}
function study(){let l=lessons[studyTopic];return `${header()}<h2>📚 Academia Matemática</h2><div class="row between"><span class="tag">🤖 PROFE BLOCK: ¡Tú puedes!</span><button class="ghost" onclick="backStudy()">↩ Regresar</button></div><p>Elige un mundo para repasar y luego vuelve a la aventura.</p><div class="row">${topics.map(([id,t])=>`<button class="${id===studyTopic?'blue':'ghost'} topbtn" onclick="showStudy('${id}','${studyOrigin}')">${t}</button>`).join('')}</div><div class="study"><h2>${l.title}</h2><p>${l.definition}</p><p><b>Consejo:</b> ${l.tip}</p></div><h3>✏️ Ejercicio explicado paso a paso</h3>${l.steps.slice(0,stepsShown).map((s,i)=>`<div class="step"><b>Paso ${i+1}.</b> ${s}</div>`).join('')}<div class="row" style="margin-top:13px"><button onclick="nextStep()" ${stepsShown===l.steps.length?'disabled':''}>Ver paso siguiente →</button><button class="ghost" onclick="stepsShown=1;draw()">↶ Volver a explicar</button></div>${stepsShown===l.steps.length?`<div class="explain"><b>¡Ahora inténtalo tú!</b><p>${l.practice}</p></div>`:''}<div class="row"><button class="blue" onclick="backStudy()">🎮 Volver al Obby</button><button class="ghost" onclick="start('training')">Practicar preguntas</button></div>`}
function draw(){gameProgress=screen==='quiz'?idx/(questions.length||1):screen==='result'?1:0;if(screen==='home'){let exists=false;try{exists=!!localStorage.getItem('pdn-obby-8-save')}catch(e){}panel.innerHTML=`<div class="center"><div class="character">🧱🎮🏆</div><span class="tag">Colegio · Matemática 8° básico</span><h1>MISIÓN PDN</h1><h2>¡El Gran Obby Matemático!</h2><p>Salta entre plataformas, resuelve desafíos y estudia con PROFE BLOCK. ¡Cada respuesta te hace avanzar!</p></div><div class="light"><label><b>Nombre del explorador:</b> <input maxlength="70" value="${escapeHtml(getName())}" oninput="setName(this.value)" placeholder="Tu nombre (opcional)"></label></div><div class="grid2"><div class="card"><h3>🧩 Entrenamiento</h3><p>Practica con ayudas, explicaciones inmediatas y sin límite de tiempo.</p><button class="blue" onclick="start('training')">Jugar y aprender</button></div><div class="card"><h3>📝 Simulacro PDN</h3><p>30 preguntas, 70 minutos y resultados al finalizar, como ensayo de prueba.</p><button onclick="start('exam')">Iniciar simulacro</button></div></div><div class="light"><label><b>Seleccionar mundo:</b> <select id="topicPick"><option value="all">🌎 Todos los mundos (recomendado)</option>${topics.map(([id,name])=>`<option value="${id}">${name}</option>`).join('')}</select></label><p class="small">El simulacro completo de 30 preguntas usa la opción «Todos los mundos». Al elegir uno solo, es una práctica temática más corta.</p></div><div class="row"><button class="ghost" onclick="showStudy('products','home')">📚 Entrar a la Academia</button>${exists?'<button class="ghost" onclick="resume()">▶ Continuar partida</button>':''}</div><p class="footer">Juego original inspirado en aventuras de plataformas tipo Obby · Funciona sin internet · ${bank.length} preguntas originales</p>`}else if(screen==='quiz')panel.innerHTML=quiz();else if(screen==='study')panel.innerHTML=study();else if(screen==='result')panel.innerHTML=results()}
// Escenario animado de plataformas con perspectiva y avatar original estilo blocky.
const canvas=$('scene'),ctx=canvas.getContext('2d');let W=0,H=0,t=0;function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();function polygon(points,fill,stroke){ctx.beginPath();ctx.moveTo(...points[0]);points.slice(1).forEach(p=>ctx.lineTo(...p));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}function avatar(x,y,s=1){ctx.save();ctx.translate(x,y+Math.sin(t*2)*3-(avatarJump>0?17:avatarJump<0?-11:0));ctx.scale(s,s);ctx.fillStyle='#24336c';ctx.fillRect(-13,19,11,22);ctx.fillRect(3,19,11,22);ctx.fillStyle='#28b48b';ctx.fillRect(-22,-11,44,34);ctx.fillStyle='#f3bd7a';ctx.fillRect(-34,-8,12,29);ctx.fillRect(22,-8,12,29);ctx.fillRect(-17,-39,34,30);ctx.fillStyle='#343c53';ctx.fillRect(-7,-25,4,4);ctx.fillRect(7,-25,4,4);ctx.restore()}function renderScene(){t+=.012;let w=innerWidth,h=innerHeight;let grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#69bafd');grad.addColorStop(.75,'#c4e8ff');grad.addColorStop(1,'#f7faff');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);for(let i=0;i<9;i++){let xx=((i*239+t*(8+i%4))%(w+280))-140,yy=36+(i*103)%(h*.54);ctx.fillStyle='#ffffffaa';ctx.beginPath();ctx.ellipse(xx,yy,65,19,0,0,Math.PI*2);ctx.ellipse(xx+35,yy-11,35,25,0,0,Math.PI*2);ctx.ellipse(xx-24,yy-10,30,22,0,0,Math.PI*2);ctx.fill()}for(let i=0;i<8;i++){let depth=i/8,px=w*.11+depth*w*.87,py=h*.77-depth*h*.52+Math.sin(t+i)*5;let s=1.15-depth*.6;polygon([[px-76*s,py],[px+76*s,py],[px+45*s,py+37*s],[px-104*s,py+37*s]],['#79d989','#ffdc72','#a97bf0','#6bd7ed'][i%4]);polygon([[px-104*s,py+37*s],[px+45*s,py+37*s],[px+45*s,py+54*s],[px-104*s,py+54*s]],'#4875a5');polygon([[px+45*s,py+37*s],[px+76*s,py],[px+76*s,py+16*s],[px+45*s,py+54*s]],'#335c93')}avatar(w*.11,h*.72,.9);requestAnimationFrame(renderScene)}requestAnimationFrame(renderScene);draw();
</script></body></html>
