ap button{padding:7px 0;background:#14243b}.questionmap button.done{background:#29516b}.questionmap button.current{outline:2px solid var(--gold)}.questionmap button.marked{border-color:#c4a775}.sectiontitle{color:var(--gold);margin-top:20px;font-size:13px;text-transform:uppercase;letter-spacing:.1em}.chart{width:100%;max-width:470px;display:block;margin:10px auto;border:1px solid #3a4b63;background:#0d1b2e;border-radius:9px}.graphMini .chart{margin:0;width:100%}.reviewItem{border:1px solid var(--line);border-radius:12px;margin:12px 0;padding:15px}.reviewItem p{margin:6px 0}.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.pill{border:1px solid var(--line);border-radius:50px;padding:5px 12px;font-size:12px;color:var(--muted)}.sep{height:1px;background:var(--line);margin:18px 0}.green{color:var(--good)}.red{color:var(--bad)}.formula{font-family:Cambria,'Times New Roman',serif;color:#f6e7c8;font-size:1.12em}.notice{padding:12px;border-left:3px solid var(--gold);background:#342d2640;color:#d7c9b6;margin-top:16px}footer{color:#8298b0;text-align:center;padding:20px;font-size:12px}svg text{font-family:Arial,sans-serif}.barChart{display:grid;gap:10px}.bar{height:12px;background:#233852;border-radius:10px;overflow:hidden}.bar div{background:#73b9e7;height:100%}details{margin:9px 0;border:1px solid var(--line);border-radius:10px;padding:12px}summary{cursor:pointer;font-weight:700}.sema{display:flex;gap:8px;flex-wrap:wrap}.sema button{flex:1}.sema button.active{outline:2px solid white}@media(max-width:820px){.hero,.layout{grid-template-columns:1fr}.side{order:2}.lessonGrid{grid-template-columns:1fr}.answers{grid-template-columns:1fr}.panel{padding:19px}.nav{flex-wrap:wrap}.brand{font-size:15px}.stats{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><div class="nav"><div class="brand">Δ <span>DESAFÍO</span> CUADRÁTICO</div><button id="homeBtn">Inicio</button><button id="academyBtn">Centro de estudio</button><button id="resumeBtn" class="push hidden">Continuar partida</button></div></header><main id="app"></main><footer>Material de práctica original · II Medio · Matemática · Funciona sin conexión · Resultados almacenados solo en este dispositivo</footer><script>
'use strict';
const CATS=['Ecuaciones cuadráticas','Fórmula y discriminante','Raíces e intersecciones','Vértice y concavidad','Análisis de gráficos','Modelación y aplicaciones'];
const D='PDN_II_MEDIO_CUADRATICO_2026_V1';
const $=s=>document.querySelector(s),app=$('#app');let bank=[],session=null,timer=null,studyFromGame=false;
const fmt=n=>Number.isInteger(n)?String(n):String(Math.round(n*100)/100).replace('.',',');
const sign=n=>n<0?' − '+Math.abs(n):' + '+n;
const sq=(a,b,c)=>`${a===1?'':a===-1?'−':a}x²${b===0?'':(b<0?' − ':' + ')+(Math.abs(b)===1?'':Math.abs(b))+'x'}${c===0?'':sign(c)}`;
const lin=(a,b)=>`${a===1?'':a===-1?'−':a}x${b===0?'':sign(b)}`;
const choices=(right,wrong)=>{let vals=[String(right),...wrong.map(String)].filter((v,i,a)=>a.indexOf(v)===i);let k=1;while(vals.length<4){let v=typeof right==='number'?String(right+17*k):String(right)+' + '+k;if(!vals.includes(v))vals.push(v);k++}return {opts:vals.slice(0,4).map(text=>({text})),answer:0}};
function add(cat,q,right,wrong,explain,hint,extra={}){let c=choices(right,wrong);bank.push({id:'Q'+(bank.length+1),cat,q,...c,explain,hint,...extra});}
function graph(a,b,c,w=350,h=255){let X=x=>w/2+x*(w-42)/18,Y=y=>h/2-y*(h-35)/18;let lines='';for(let n=-8;n<=8;n++){lines+=`<line x1="${X(n)}" y1="${Y(-9)}" x2="${X(n)}" y2="${Y(9)}" stroke="#263d54" stroke-width=".7"/><line x1="${X(-9)}" y1="${Y(n)}" x2="${X(9)}" y2="${Y(n)}" stroke="#263d54" stroke-width=".7"/>`;}let pts=[];for(let i=-9;i<=9.01;i+=.07){let y=a*i*i+b*i+c;pts.push((pts.length?'L':'M')+X(i).toFixed(1)+' '+Y(y).toFixed(1));}let labels='';for(let n=-8;n<=8;n+=2){if(n){labels+=`<text x="${X(n)}" y="${Y(0)+14}" font-size="10" text-anchor="middle" fill="#9fb4c9">${n}</text><text x="${X(0)-8}" y="${Y(n)+3}" font-size="10" text-anchor="end" fill="#9fb4c9">${n}</text>`}}return `<svg role="img" aria-label="Plano cartesiano con una parábola" class="chart" viewBox="0 0 ${w} ${h}"><defs><clipPath id="clip-${a}-${b}-${c}-${w}"><rect width="${w}" height="${h}"/></clipPath></defs>${lines}<line x1="${X(-9)}" y1="${Y(0)}" x2="${X(9)}" y2="${Y(0)}" stroke="#8fa9c3" stroke-width="1.5"/><line x1="${X(0)}" y1="${Y(-9)}" x2="${X(0)}" y2="${Y(9)}" stroke="#8fa9c3" stroke-width="1.5"/>${labels}<text x="${w-12}" y="${Y(0)-8}" fill="#c8d6e8" font-size="12">x</text><text x="${X(0)+8}" y="16" fill="#c8d6e8" font-size="12">y</text><path clip-path="url(#clip-${a}-${b}-${c}-${w})" d="${pts.join(' ')}" fill="none" stroke="#dfb877" stroke-width="2.8" stroke-linejoin="round"/></svg>`}
function buildBank(){bank=[];
// 1: solving and construction, 18
for(let i=0;i<18;i++){let r=(i%6)+1,s=(Math.floor(i/6)%3)+2;if(r===s)s+=5;let b=-(r+s),c=r*s;
if(i%3===0)add(0,`¿Cuáles son las soluciones de la ecuación <span class="formula">${sq(1,b,c)} = 0</span>?`,`x = ${r} y x = ${s}`,[`x = −${r} y x = −${s}`,`x = ${r} y x = −${s}`,`x = ${r+s} y x = ${r*s}`],`Se factoriza como (x − ${r})(x − ${s}) = 0. Las raíces son ${r} y ${s}.`,'Busca dos números cuyo producto sea el término independiente y cuya suma sea el opuesto del coeficiente de x.');
else if(i%3===1)add(0,`Una ecuación tiene soluciones <span class="formula">x = ${r}</span> y <span class="formula">x = −${s}</span>. ¿Cuál es su forma desarrollada?`,sq(1,s-r,-r*s),[sq(1,r-s,-r*s),sq(1,s+r,r*s),sq(1,s-r,r*s)],`El producto (x − ${r})(x + ${s}) produce ${sq(1,s-r,-r*s)}.`,'Parte del producto (x − raíz 1)(x − raíz 2).');
else add(0,`En la ecuación <span class="formula">${sq(1,b,c)} = 0</span>, ¿cuál es el producto de sus soluciones?`,r*s,[r+s,-r*s,-(r+s)],`Por las relaciones de Viète, x₁·x₂ = c/a = ${c}/1 = ${r*s}.`,'Relaciona el producto de las soluciones con los coeficientes a y c.');}
// 2: discriminant and formula, 18
for(let i=0;i<18;i++){let a=i%2?2:1,b=(i%5)+1,c=(i%3)-2,delta=b*b-4*a*c;
if(i%3===0)add(1,`Calcula el discriminante de <span class="formula">${sq(a,b,c)} = 0</span>.`,delta,[delta+4,delta-4,b*b+4*a*c],`Δ = b² − 4ac = ${b}² − 4·${a}·(${c}) = ${delta}.`,'Identifica a, b y c, prestando atención a sus signos.');
else if(i%3===1){let typ=delta>0?'dos soluciones reales distintas':delta===0?'una solución real doble':'ninguna solución real';let arr=['dos soluciones reales distintas','una solución real doble','ninguna solución real'];let distract=arr.filter(x=>x!==typ);add(1,`Para <span class="formula">${sq(a,b,c)} = 0</span>, ¿qué indica el discriminante?`,typ,[...distract,'dos soluciones imaginarias y una real'],`Δ = ${delta}. Si Δ es positivo hay dos raíces reales; si es cero hay una doble; si es negativo no hay raíces reales.`,'Determina el signo de Δ antes de decidir el número de soluciones.');}
else add(1,'¿Cuál es la fórmula general para resolver <span class="formula">ax² + bx + c = 0</span>, con a ≠ 0?', 'x = (−b ± √(b² − 4ac)) / (2a)',['x = (b ± √(b² − 4ac)) / (2a)','x = (−b ± √(b² + 4ac)) / (2a)','x = (−b ± √(b² − 4ac)) / a'],'La fórmula cuadrática usa −b, el discriminante b² − 4ac y el denominador 2a.','Recuerda los tres componentes de la fórmula: signo inicial, radicando y denominador.');}
// 3: roots intersections, 18
for(let i=0;i<18;i++){let r=(i%5)-2,s=r+((Math.floor(i/5)%3)+2),a=i%2?1:-1,b=-a*(r+s),c=a*r*s;if(i%3===0)add(2,`La función <span class="formula">f(x) = ${sq(a,b,c)}</span> intersecta el eje x en:`,`(${r}, 0) y (${s}, 0)`,[`(${r}, ${c}) y (${s}, ${c})`,`(${-r}, 0) y (${-s}, 0)`,`(0, ${r}) y (0, ${s})`],`Para la intersección con el eje x, f(x)=0. Factorizando a(x − ${r})(x − ${s}), se obtienen x=${r} y x=${s}.`,'Las intersecciones con el eje x tienen coordenada y igual a cero.');
else if(i%3===1)add(2,`Para <span class="formula">f(x) = ${sq(a,b,c)}</span>, ¿en qué punto corta el eje y?`,`(0, ${c})`,[`(${c}, 0)`,`(0, ${-c})`,`(1, ${a+b+c})`],`Se reemplaza x=0, de modo que f(0)=${c}; la intersección es (0,${c}).`,'En el eje y, la variable x vale cero.');
else add(2,`Las raíces de <span class="formula">f(x) = ${sq(a,b,c)}</span> son ${r} y ${s}. ¿Cuál es su suma?`,r+s,[r*s,-(r+s),-(r*s)],`Por Viète, x₁+x₂=−b/a=${r+s}.`,'La suma de raíces se relaciona con b y a.');}
// 4: vertex, concavity, symmetry, 18
for(let i=0;i<18;i++){let h=(i%5)-2,k=(Math.floor(i/5)%5)-2,a=i%2?1:-1,b=-2*a*h,c=a*h*h+k;let txt=sq(a,b,c);
if(i%3===0)add(3,`Encuentra el vértice de <span class="formula">f(x) = ${txt}</span>.`,`(${h}, ${k})`,[`(${-h}, ${k})`,`(${h}, ${-k})`,`(${k}, ${h})`],`La forma de vértice es ${a===1?'':'−'}(x ${h<0?'+ '+Math.abs(h):'− '+h})² ${k<0?'− '+Math.abs(k):'+ '+k}. Por tanto V=(${h}, ${k}).`,'Calcula la coordenada horizontal con −b/(2a); luego reemplaza en f.');
else if(i%3===1)add(3,`Para <span class="formula">f(x) = ${txt}</span>, la concavidad de la parábola es:`,a>0?'Hacia arriba':'Hacia abajo',['Hacia la derecha','Hacia la izquierda',a>0?'Hacia abajo':'Hacia arriba'],`El coeficiente principal es a=${a}. Su signo determina que la parábola abra ${a>0?'hacia arriba':'hacia abajo'}.`,'La concavidad depende del signo del coeficiente del término x².');
else add(3,`¿Cuál es el eje de simetría de <span class="formula">f(x) = ${txt}</span>?`,`x = ${h}`,[`y = ${h}`,`x = ${-h}`,`y = ${k}`],`El eje de simetría pasa por el vértice (${h},${k}) y corresponde a x=${h}.`,'El eje de simetría de una parábola vertical es una recta vertical.');}
// 5: graphs 18, graph in prompt and visual options
for(let i=0;i<18;i++){let h=(i%5)-2,k=(Math.floor(i/5)%4)-2,a=i%2?1:-1,b=-2*a*h,c=a*h*h+k;let gs=[{a,b,c},{a:-a,b:-b,c:-c},{a,b:-2*a*(h+2),c:a*(h+2)**2+k},{a,b,c:c+3}];if(i%3===0){let q=`¿Qué gráfica representa <span class="formula">f(x) = ${sq(a,b,c)}</span>?`;let ans=gs.map((g,j)=>({text:`Gráfica ${'ABCD'[j]}`,curve:g}));bank.push({id:'Q'+(bank.length+1),cat:4,q,opts:ans,answer:0,explain:`La parábola tiene vértice (${h},${k}) y abre ${a>0?'hacia arriba':'hacia abajo'}. Confirma también el corte con el eje y: ${c}.`,hint:'Observa primero la concavidad y el vértice; luego verifica la intersección con el eje y.'});}
else if(i%3===1)add(4,`Observa la parábola graficada. ¿Cuál es su vértice?`,`(${h}, ${k})`,[`(${h+2}, ${k})`,`(${h}, ${k+2})`,`(${-h}, ${k})`],`El vértice es el punto mínimo o máximo del gráfico: (${h}, ${k}).`,'Busca el punto donde la curva cambia de dirección.',{plot:{a,b,c}});
else add(4,`Observa la parábola. ¿Cuál afirmación es correcta?`,a>0?'Presenta un mínimo':'Presenta un máximo',[a>0?'Presenta un máximo':'Presenta un mínimo','Es una función lineal','Su eje de simetría es horizontal'],`Como a=${a}, la parábola abre ${a>0?'hacia arriba y tiene mínimo':'hacia abajo y tiene máximo'}.`,'Observa hacia dónde se abren los brazos de la parábola.',{plot:{a,b,c}});}
// 6: application, 18
for(let i=0;i<18;i++){let h=(i%5)+2,H=(i%4)+6;let a=-1,b=2*h,c=H-h*h;
if(i%3===0)add(5,`La altura de un objeto se modela por <span class="formula">h(t) = ${sq(a,b,c)}</span>, con t ≥ 0. ¿En qué instante alcanza su altura máxima?`,`${h} s`,[`${h+1} s`,`${2*h} s`,`${H} s`],`La altura máxima ocurre en el vértice: t=−b/(2a)=−${b}/(−2)=${h} s.`,'La coordenada horizontal del vértice es el instante extremo.',{plot:{a,b,c}});
else if(i%3===1)add(5,`Una pelota sigue <span class="formula">h(t) = ${sq(a,b,c)}</span> (metros). ¿Cuál es su altura máxima?`,`${H} m`,[`${H+h} m`,`${H-1} m`,`${h} m`],`El máximo se alcanza en t=${h}. La altura es h(${h})=${H} metros.`,'Calcula primero el instante del vértice y luego evalúa la función.');
else{let x=(i%5)+8,y=x+3,area=x*y;add(5,`Un jardín rectangular tiene el largo 3 m mayor que el ancho. Si su área es ${area} m², ¿qué ecuación permite hallar el ancho x?`,`x² + 3x − ${area} = 0`,[`x² − 3x − ${area} = 0`,`x² + 3x + ${area} = 0`,`2x + 3 = ${area}`],`Ancho x, largo x+3. Área x(x+3)=${area}, luego x²+3x−${area}=0.`,'Escribe largo por ancho igual al área antes de ordenar los términos.');}}
if(bank.length!==108)throw Error('Banco incompleto '+bank.length);for(const q of bank){if(q.opts.length!==4||new Set(q.opts.map(o=>o.text+(o.curve?JSON.stringify(o.curve):''))).size!==4)throw Error('Opciones inválidas '+q.id);}
}
buildBank();
const pick=(n)=>{let ar=[...n];for(let i=ar.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[ar[i],ar[j]]=[ar[j],ar[i]]}return ar};
function safe(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(){if(session){try{localStorage.setItem(D,JSON.stringify(session));}catch(e){}}}
function load(){try{let s=JSON.parse(localStorage.getItem(D)||'null');if(s&&Array.isArray(s.ids)&&s.ids.length===30&&s.answers?.length===30&&s.orders?.length===30&&['training','exam'].includes(s.mode))session=s;}catch(e){session=null}}
function show(html){app.innerHTML=html;window.scrollTo({top:0,behavior:'instant'});}
function home(){clearInterval(timer);timer=null;let resumed=!!session;show(`<div class="panel hero"><div><div class="eyebrow">Matemática · II Medio</div><h1>Desafío <span style="color:var(--gold)">Cuadrático</span></h1><p class="sub">Un laboratorio de aprendizaje para entrenar el razonamiento algebraico, explorar parábolas y preparar la prueba de nivel.</p><span class="tag">108 desafíos originales</span><span class="tag">30 preguntas por partida</span><span class="tag">Sin conexión</span><div class="actions"><button class="primary" id="train">Iniciar entrenamiento</button><button class="gold" id="exam">Simulacro PDN · 70 min</button><button id="study">Centro de estudio</button>${resumed?'<button id="continue">Continuar partida</button>':''}</div><div class="notice tiny">Preguntas nuevas basadas en los contenidos de la evaluación. No reproduce respuestas de la prueba oficial.</div></div><div><div class="eyebrow">Mapa conceptual</div>${graph(1,-2,-3)}<div class="stats"><div class="stat"><strong>6</strong><small>áreas</small></div><div class="stat"><strong>30</strong><small>ítems</small></div><div class="stat"><strong>70</strong><small>minutos</small></div></div></div></div><section class="panel" style="margin-top:18px"><h2>Áreas de aprendizaje</h2><div class="lessonGrid">${CATS.map((t,i)=>`<div class="lesson"><div class="eyebrow">Módulo ${i+1}</div><h3>${t}</h3><p>${['Factorización y resolución de ecuaciones de segundo grado.','Fórmula general, cálculo e interpretación del discriminante.','Ceros de funciones y cortes con los ejes.','Coordenadas del vértice, máximos, mínimos y concavidad.','Lectura y asociación de funciones con sus gráficos.','Problemas de movimiento y situaciones geométricas.'][i]}</p></div>`).join('')}</div></section>`);$('#train').onclick=()=>start('training');$('#exam').onclick=()=>start('exam');$('#study').onclick=()=>study();if(resumed)$('#continue').onclick=()=>play();updateNav();}
function updateNav(){$('#resumeBtn').classList.toggle('hidden',!session);$('#resumeBtn').onclick=()=>play();}
function start(mode){if(session&&!confirm('Se reemplazará la partida que tienes guardada. ¿Continuar?'))return;let selected=[];for(let k=0;k<6;k++)selected.push(...pick(bank.filter(q=>q.cat===k)).slice(0,5));selected=pick(selected);session={mode,ids:selected.map(q=>q.id),orders:selected.map(()=>pick([0,1,2,3])),answers:Array(30).fill(null),marked:Array(30).fill(false),index:0,started:Date.now(),elapsed:0,finished:false,student:'',traffic:'',reflection:''};save();play();}
function current(){return bank.find(q=>q.id===session.ids[session.index])}
function elapsed(){return session.elapsed+(session.mode==='exam'&&!session.finished?Math.max(0,Date.now()-session.started):0)}
function clock(){let sec=Math.max(0,Math.ceil((70*60*1000-elapsed())/1000));return `${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toString().padStart(2,'0')}`}
function tick(){let t=$('#clock');if(t)t.textContent=session.mode==='exam'?clock():'Sin límite';if(session.mode==='exam'&&elapsed()>=70*60000){finish(true)}}
function optionText(op){return op.curve?`<div class="graphMini">${graph(op.curve.a,op.curve.b,op.curve.c,240,175)}</div>`:safe(op.text)}
function play(){if(!session)return home();clearInterval(timer);if(session.finished)return results();let s=session,q=current(),idx=s.index,order=s.orders[idx],ans=s.answers[idx];let training=s.mode==='training';let locked=training&&ans!==null;show(`<div class="gamehead"><div><span class="eyebrow">${training?'Entrenamiento con tutoría':'Simulacro de prueba de nivel'}</span><h2>Pregunta ${idx+1} de 30</h2></div><div class="flex"><span class="pill">${CATS[q.cat]}</span><span class="pill" id="clock">${training?'Sin límite':clock()}</span></div></div><div class="progress"><div style="width:${(s.answers.filter(a=>a!==null).length/30*100).toFixed(1)}%"></div></div><div class="layout"><section class="panel"><div class="eyebrow">${CATS[q.cat]}</div><div class="qbox">${q.q}</div>${q.plot?graph(q.plot.a,q.plot.b,q.plot.c):''}<div class="answers">${order.map((j,pos)=>`<button class="answer ${ans===j?'selected':''} ${locked&&j===q.answer?'correct':''} ${locked&&ans===j&&j!==q.answer?'wrong':''}" data-opt="${j}" ${locked?'disabled':''}><span class="letter">${'ABCD'[pos]}</span><span>${optionText(q.opts[j])}</span></button>`).join('')}</div>${training?`<div class="actions"><button id="hint">Pista</button><button id="example">Ejemplo resuelto</button><button id="goStudy">Centro de estudio</button></div><div id="support" class="feedback hidden"></div>${locked?`<div class="feedback"><strong class="${ans===q.answer?'green':'red'}">${ans===q.answer?'Respuesta correcta':'Respuesta por revisar'}</strong><p>${q.explain}</p></div>`:''}`:''}<div class="tools"><button id="prev" ${idx===0?'disabled':''}>Anterior</button><div class="flex"><button id="mark">${s.marked[idx]?'Quitar marca':'Marcar para revisar'}</button>${idx===29?'<button class="gold" id="end">Finalizar</button>':'<button class="primary" id="next">Siguiente</button>'}</div></div></section><aside class="side"><div class="panel"><h3>Panel de avance</h3><p class="tiny">${s.answers.filter(x=>x!==null).length} de 30 respondidas</p><div class="questionmap">${s.ids.map((_,i)=>`<button data-goto="${i}" class="${s.answers[i]!==null?'done':''} ${i===idx?'current':''} ${s.marked[i]?'marked':''}">${i+1}</button>`).join('')}</div><div class="sep"></div><p class="tiny">${training?'Puedes consultar ayudas y ver las soluciones después de cada respuesta.':'No se muestran pistas ni soluciones durante el simulacro.'}</p><button id="leave">Volver al inicio</button></div></aside></div>`);
$$('[data-opt]').forEach(el=>el.onclick=()=>{if(locked)return;s.answers[idx]=Number(el.dataset.opt);save();play();});$$('[data-goto]').forEach(el=>el.onclick=()=>{s.index=Number(el.dataset.goto);save();play()});$('#prev').onclick=()=>{s.index--;save();play()};$('#mark').onclick=()=>{s.marked[idx]=!s.marked[idx];save();play()};$('#leave').onclick=()=>{if(s.mode==='exam'){s.elapsed=elapsed();s.started=Date.now();save();}home()};if($('#next'))$('#next').onclick=()=>{s.index++;save();play()};if($('#end'))$('#end').onclick=()=>finish(false);
if(training){$('#hint').onclick=()=>support('Pista',q.hint);$('#example').onclick=()=>{let p=bank.filter(x=>x.cat===q.cat&&x.id!==q.id)[0];support('Ejemplo similar',`<strong>${p.q}</strong><p>${p.explain}</p>`) };$('#goStudy').onclick=()=>{studyFromGame=true;study(q.cat)}}
if(s.mode==='exam'){timer=setInterval(tick,1000);tick()}}
function $$(s){return document.querySelectorAll(s)}
function support(title,content){let el=$('#support');el.classList.remove('hidden');el.innerHTML=`<strong>${title}</strong><p>${content}</p>`}
function finish(auto){if(!session||session.finished)return;let missing=session.answers.filter(a=>a===null).length;if(!auto&&missing&&!confirm(`Hay ${missing} preguntas sin responder. ¿Finalizar igualmente?`))return;if(session.mode==='exam')session.elapsed=elapsed();session.finished=true;clearInterval(timer);save();results();}
function score(){return session.ids.reduce((n,id,i)=>n+(session.answers[i]===bank.find(q=>q.id===id).answer?1:0),0)}
function results(){clearInterval(timer);let s=session;if(!s)return home();let n=score(),pct=Math.round(n/30*100);let by=CATS.map((c,k)=>{let ids=s.ids.map((id,i)=>({q:bank.find(q=>q.id===id),i})).filter(o=>o.q.cat===k);let ok=ids.filter(o=>s.answers[o.i]===o.q.answer).length;return {c,k,ok,total:ids.length}});show(`<section class="panel"><div class="eyebrow">Informe de desempeño</div><h1>Resultados del desafío</h1><div class="stats"><div class="stat"><strong>${n}/30</strong><small>Respuestas correctas</small></div><div class="stat"><strong>${pct}%</strong><small>Logro</small></div><div class="stat"><strong>${s.mode==='exam'?Math.floor(s.elapsed/60000)+' min':'Libre'}</strong><small>Tiempo de trabajo</small></div></div><label class="tiny" for="student">Nombre (opcional)</label><input id="student" placeholder="Nombre del estudiante" value="${safe(s.student)}"><h2 style="margin-top:25px">Resultados por contenido</h2><div class="barChart">${by.map(o=>`<div><div class="flex" style="justify-content:space-between"><strong>${o.c}</strong><span>${o.ok}/${o.total}</span></div><div class="bar"><div style="width:${o.ok/o.total*100}%"></div></div></div>`).join('')}</div><h2 style="margin-top:25px">Autoevaluación</h2><p>¿Cómo evalúas tu aprendizaje?</p><div class="sema"><button data-light="verde" class="${s.traffic==='verde'?'active':''}">🟢 Puedo resolverlo</button><button data-light="amarillo" class="${s.traffic==='amarillo'?'active':''}">🟡 Debo practicar</button><button data-light="rojo" class="${s.traffic==='rojo'?'active':''}">🔴 Necesito ayuda</button></div><p>¿Qué contenido necesitas reforzar?</p><textarea id="reflection" rows="2">${safe(s.reflection)}</textarea><div class="actions"><button class="primary" id="csv">Descargar CSV</button><button id="repeat">Nuevo simulacro</button><button id="studyAgain">Repasar contenidos</button><button id="reviewBtn">Ver revisión completa</button><button id="practiceWrong">Practicar errores</button></div></section><div id="review" class="hidden" style="margin-top:20px"></div>`);$('#student').oninput=e=>{s.student=e.target.value;save()};$('#reflection').oninput=e=>{s.reflection=e.target.value;save()};$$('[data-light]').forEach(b=>b.onclick=()=>{s.traffic=b.dataset.light;save();results()});$('#csv').onclick=csv;$('#repeat').onclick=()=>start(s.mode);$('#studyAgain').onclick=()=>study();$('#reviewBtn').onclick=review;$('#practiceWrong').onclick=()=>{let weakest=by.sort((a,b)=>a.ok/a.total-b.ok/b.total)[0];startFocus(weakest.k)};updateNav();}
function review(){let el=$('#review');el.classList.toggle('hidden');if(el.classList.contains('hidden'))return;el.innerHTML=`<h2>Revisión de respuestas</h2>${session.ids.map((id,i)=>{let q=bank.find(v=>v.id===id),a=session.answers[i],correct=a===q.answer;return `<div class="reviewItem"><div class="eyebrow">Pregunta ${i+1} · ${CATS[q.cat]}</div><strong>${q.q.replace(/<[^>]*>/g,'')}</strong><p class="${correct?'green':'red'}">${correct?'Correcta':'Para reforzar'} · Tu respuesta: ${a===null?'Sin responder':safe(q.opts[a].text)} · Respuesta esperada: ${safe(q.opts[q.answer].text)}</p><p>${q.explain}</p></div>`}).join('')}`}
function startFocus(cat){if(!confirm('Se iniciará una nueva práctica centrada en el contenido con más dificultades. ¿Continuar?'))return;let arr=[...pick(bank.filter(q=>q.cat===cat)).slice(0,18),...pick(bank.filter(q=>q.cat!==cat)).slice(0,12)];arr=pick(arr);session={mode:'training',ids:arr.map(q=>q.id),orders:arr.map(()=>pick([0,1,2,3])),answers:Array(30).fill(null),marked:Array(30).fill(false),index:0,started:Date.now(),elapsed:0,finished:false,student:'',traffic:'',reflection:''};save();play()}
function csv(){let rows=[['Alumno','Curso','Modalidad','Puntaje','Total','Porcentaje','Semáforo','Reflexión'],[session.student,'II Medio',session.mode,score(),30,Math.round(score()/30*100),session.traffic,session.reflection],[],['Pregunta','Contenido','Resultado','Respuesta','Respuesta correcta']];session.ids.forEach((id,i)=>{let q=bank.find(x=>x.id===id),a=session.answers[i];rows.push([i+1,CATS[q.cat],a===q.answer?'Correcta':'Incorrecta / Sin responder',a===null?'':q.opts[a].text,q.opts[q.answer].text])});let csv=rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='resultados_desafio_cuadratico_II_medio.csv';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
const LESSONS=[
{title:'Ecuaciones cuadráticas',body:'Una ecuación de segundo grado se expresa como ax² + bx + c = 0, donde a ≠ 0. Se puede resolver por factorización o fórmula general.',ex:'x² − 5x + 6 = 0 → (x − 2)(x − 3) = 0 → x = 2 o x = 3.',tip:'Comprobar cada raíz reemplazando en la ecuación inicial.'},
{title:'Fórmula y discriminante',body:'La fórmula general es x = (−b ± √Δ)/(2a), donde Δ = b² − 4ac. Si Δ > 0 hay dos raíces reales; si Δ = 0 hay una raíz doble; si Δ < 0 no hay raíces reales.',ex:'x² − 4x + 3 = 0: Δ = 16 − 12 = 4; x = (4 ± 2)/2 → x = 1 y x = 3.',tip:'Usa paréntesis cuando un coeficiente es negativo.'},
{title:'Raíces e intersecciones',body:'Las raíces son los valores de x cuando f(x) = 0 y muestran el corte con el eje x. Para el corte con el eje y se evalúa f(0), que es c.',ex:'f(x) = x² − 4: raíces x = −2 y x = 2; intersecciones (−2,0) y (2,0); corte con y: (0,−4).',tip:'No confundir raíz x con punto de intersección (x,0).'},
{title:'Vértice y concavidad',body:'El vértice es V = (−b/(2a), f(−b/(2a))). Si a > 0 la parábola es cóncava hacia arriba y tiene mínimo; si a < 0 es cóncava hacia abajo y tiene máximo.',ex:'f(x) = −x² + 4x + 1: x del vértice = −4/(−2) = 2; f(2) = 5; V = (2,5).',tip:'El eje de simetría pasa por el vértice: x = −b/(2a).'},
{title:'Interpretación gráfica',body:'Para reconocer una parábola observa concavidad, vértice, cortes con los ejes y eje de simetría. La forma canónica es f(x) = a(x − h)² + k.',ex:'f(x) = (x − 1)² − 3 abre hacia arriba, con vértice (1,−3) y eje de simetría x = 1.',tip:'Una sola característica no siempre basta para identificar la gráfica correcta.'},
{title:'Modelación cuadrática',body:'En problemas de movimiento, el tiempo del máximo o mínimo corresponde a la coordenada horizontal del vértice. Para hallar la altura extrema evalúa la función en ese instante.',ex:'h(t) = −t² + 6t + 2. El instante máximo es t = 3 s y la altura máxima es h(3) = 11 m.',tip:'Lee el contexto: el dominio real puede estar limitado por tiempo o distancia.'}];
function study(cat=-1){clearInterval(timer);if(session&&session.mode==='exam'&&!session.finished){session.elapsed=elapsed();session.started=Date.now();save()}show(`<div class="panel"><div class="eyebrow">Centro de estudio · Tutoría autónoma</div><h1>Academia Cuadrática</h1><p class="sub">Conceptos esenciales y ejemplos resueltos. Material independiente de las preguntas del simulacro.</p><div class="actions"><button id="backFromStudy">${session&&!session.finished?'Volver a la partida':'Volver al inicio'}</button></div><div class="lessonGrid" style="margin-top:25px">${LESSONS.map((l,i)=>`<div class="lesson" ${cat===i?'style="border-color:#cbb47d"':''}><div class="eyebrow">Módulo ${i+1}</div><h3>${l.title}</h3><p>${l.body}</p><details ${cat===i?'open':''}><summary>Ejemplo resuelto</summary><p>${l.ex}</p></details><div class="tiny muted">Consejo: ${l.tip}</div><button style="margin-top:12px" data-topic="${i}">Practicar este tema</button></div>`).join('')}</div><div class="notice">Recuerda: las preguntas de la prueba original no se muestran en esta academia; los ejemplos fueron creados para practicar los mismos contenidos.</div></div>`);$('#backFromStudy').onclick=()=>session&&!session.finished?play():home();$$('[data-topic]').forEach(b=>b.onclick=()=>{if(session&&!confirm('Iniciar otra práctica reemplazará la partida actual. ¿Continuar?'))return;let k=+b.dataset.topic;let arr=pick([...pick(bank.filter(q=>q.cat===k)).slice(0,18),...pick(bank.filter(q=>q.cat!==k)).slice(0,12)]);session={mode:'training',ids:arr.map(q=>q.id),orders:arr.map(()=>pick([0,1,2,3])),answers:Array(30).fill(null),marked:Array(30).fill(false),index:0,started:Date.now(),elapsed:0,finished:false,student:'',traffic:'',reflection:''};save();play()});}
$('#homeBtn').onclick=home;$('#academyBtn').onclick=()=>study();load();home();
</script></body></html>
