'use strict';
const $=x=>document.getElementById(x), panel=$('panel');let screen='home',mode='training',chosenTopic='all',questions=[],idx=0,answers={},helpLevel=0,started=0,remaining=4200,clock=null,feedback=false,stepsShown=1,studyTopic='language',studyOrigin='home',gameProgress=0,avatarJump=0,score=0;
const topics=[['language','🗣️ Portal del lenguaje algebraico'],['terms','🧱 Torre de términos semejantes'],['values','💎 Laboratorio de valorización'],['equations','⚖️ Castillo de ecuaciones'],['inequalities','🚀 Pista de inecuaciones']];
const lessons={
language:{title:'Lenguaje y expresiones algebraicas',definition:'Una letra representa una cantidad desconocida. El doble de x es 2x; la mitad es x/2; tres más que x es x+3. Un monomio tiene un término, un binomio dos y un trinomio tres.',steps:['Ejemplo: traduce «la mitad de un número aumentada en 7».','Representamos el número con x y su mitad con x/2.','Aumentar en 7 significa sumar: x/2 + 7.'],tip:'Lee con atención el orden: «el doble de un número más 3» puede ser 2x+3, mientras «el doble de la suma de un número y 3» es 2(x+3).',practice:'Intenta expresar «el triple de un número disminuido en 5» como 3x−5.'},
terms:{title:'Reducción de términos semejantes',definition:'Los términos semejantes tienen exactamente las mismas letras y exponentes. Se suman o restan sus coeficientes, respetando los signos.',steps:['Ejemplo: reduce 7x + 3y − 2x + 5y.','Agrupa letras iguales: (7x−2x)+(3y+5y).','Resultado: 5x+8y.'],tip:'No se puede sumar 4x y 3y como si fueran 7xy. En 3x²y el grado es 3 (2+1).',practice:'Reduce 6a+2b−4a+5b; da 2a+7b.'},
values:{title:'Valorización de expresiones algebraicas',definition:'Valorizar significa reemplazar cada variable por el número indicado y después calcular siguiendo el orden de las operaciones.',steps:['Ejemplo: calcula 3x + 2y para x=4, y=−2.','Sustituye: 3·4 + 2·(−2).','Multiplica y suma: 12−4=8.'],tip:'Pon paréntesis al reemplazar números negativos y calcula las potencias antes de sumar o restar.',practice:'Evalúa 2a−3 cuando a=5; resulta 7.'},
equations:{title:'Ecuaciones y balanzas en equilibrio',definition:'Una ecuación es una igualdad. Para despejar la incógnita, realiza la misma operación en ambos lados. Comprueba reemplazando la solución.',steps:['Ejemplo: resuelve 3x + 5 = 20.','Resta 5 a ambos lados: 3x = 15.','Divide ambos lados entre 3: x = 5. Comprueba: 3·5+5=20.'],tip:'En una balanza, ambos platillos pesan lo mismo; cada bolsa x representa una incógnita y cada bolita una unidad.',practice:'Resuelve 4x+3=23; x=5.'},
inequalities:{title:'Inecuaciones y recta numérica',definition:'Una inecuación compara cantidades con <, >, ≤ o ≥. Se resuelve como una ecuación, pero si multiplicas o divides por un número negativo debes invertir el signo.',steps:['Ejemplo: resuelve 2x+3 > 11.','Resta 3: 2x > 8.','Divide entre 2: x > 4. En la recta, círculo abierto en 4 y flecha hacia la derecha.'],tip:'Círculo vacío: < o >. Círculo relleno: ≤ o ≥. Hacia la derecha: mayor; hacia la izquierda: menor.',practice:'Resuelve 3x−2≤10; x≤4.'}
};
let bank=[];
function add(topic,prompt,answer,wrong,explain,graphic=null,hint='Identifica los datos y el procedimiento antes de calcular.'){
let opts=[String(answer),...wrong.map(String)];if(opts.length!==4)throw Error('Faltan opciones: '+prompt);for(let z=1;z<4;z++){if(opts.slice(0,z).includes(opts[z])){let v=Number(opts[z]);if(Number.isFinite(v)){let delta=1;while(opts.slice(0,z).includes(String(v+delta)))delta++;opts[z]=String(v+delta);}else {throw Error('Opciones textuales repetidas: '+prompt+' '+opts.join(' / '));}}}bank.push({id:'7q'+bank.length,topic,prompt,correct:String(answer),opts,explain,graphic,hint});}
function sign(n){return n<0?' − '+(-n):' + '+n}
function formatTerm(a,v){return (a===1?'':a===-1?'−':a)+v}
function exp(a,b){return formatTerm(a,'x')+(b===0?'':sign(b))}
function rectSvg(top,right){return `<svg viewBox="0 0 420 190" role="img" aria-label="Rectángulo con lados algebraicos"><rect x="75" y="40" width="268" height="100" fill="#cbe8f7" stroke="#235080" stroke-width="3"/><text x="209" y="27" text-anchor="middle" font-size="22" font-weight="bold">${top}</text><text x="355" y="98" font-size="22" font-weight="bold">${right}</text></svg>`}
function triangleSvg(a,b,c){return `<svg viewBox="0 0 400 225" role="img" aria-label="Triángulo con lados algebraicos"><path d="M200 28L55 185H345Z" fill="#cbe8f7" stroke="#235080" stroke-width="3"/><text x="102" y="100" font-size="22">${a}</text><text x="275" y="100" font-size="22">${b}</text><text x="198" y="210" font-size="22" text-anchor="middle">${c}</text></svg>`}
function balanceSvg(a,b,c,d){let x=0;function pile(co,balls,x0){let bags=Array.from({length:co},(_,i)=>`<rect x="${x0+i*39}" y="88" rx="4" width="31" height="40" fill="#77a9dc" stroke="#204b78" stroke-width="2"/><text x="${x0+i*39+10}" y="114" font-weight="bold">x</text>`).join('');let circle=Array.from({length:balls},(_,i)=>`<circle cx="${x0+i%7*19+10}" cy="${70-Math.floor(i/7)*20}" r="8" fill="#f0bc64" stroke="#956c31"/>`).join('');return bags+circle;}return `<svg viewBox="0 0 470 210" role="img" aria-label="Balanza equilibrada con incógnitas y unidades"><path d="M235 70V170M190 174H280M235 85L90 124M235 85L380 124" stroke="#40516c" stroke-width="7"/><path d="M30 130H185M285 130H440" stroke="#40516c" stroke-width="5"/><g transform="translate(35 0)">${pile(a,b,5)}</g><g transform="translate(290 0)">${pile(c,d,5)}</g><text x="235" y="199" text-anchor="middle" font-size="13">Cada esfera representa una unidad</text></svg>`}
function numberlineSvg(bound,dir,inclusive){let xmin=-10,xmax=10,cx=n=>28+(n-xmin)*17;let x=cx(bound);let left=dir==='<'?x:cx(xmin),right=dir==='<'?cx(xmin):cx(xmax);return `<svg viewBox="0 0 400 125" role="img" aria-label="Recta numérica con región solución"><path d="M20 58H380" stroke="#354f79" stroke-width="3"/>${[-10,-8,-6,-4,-2,0,2,4,6,8,10].map(k=>`<path d="M${cx(k)} 52v12" stroke="#354f79"/><text x="${cx(k)}" y="83" font-size="13" text-anchor="middle">${k}</text>`).join('')}<path d="M${x} 38L${dir==='<'?22:378} 38" stroke="#ff6e8e" stroke-width="7"/><path d="M${dir==='<'?22:378} 38 l${dir==='<'?12:-12} -8 v16z" fill="#ff6e8e"/><circle cx="${x}" cy="38" r="8" fill="${inclusive?'#ff6e8e':'white'}" stroke="#ff6e8e" stroke-width="3"/></svg>`}
// Traducción, clasificación y contexto: 22 originales.
for(let i=0;i<22;i++){let a=3+i%7,b=4+(i*3)%12,k=i%6;
if(k===0)add('language',`¿Cómo expresamos «la mitad de un número aumentada en ${b}»?`,`x/2 + ${b}`,[`(x + ${b})/2`,`2x + ${b}`,`x/(2 + ${b})`],`Primero calculamos la mitad x/2 y luego sumamos ${b}.`,null,'Identifica qué parte se divide y qué parte se suma.');
if(k===1)add('language',`El triple de un número disminuido en ${b} se escribe:`,`3x − ${b}`,[`3(x − ${b})`,`x/3 − ${b}`,`3x + ${b}`],`Multiplicar por 3 da 3x y luego restamos ${b}.`,null,'El triple significa multiplicar por tres.');
if(k===2)add('language',`«La suma de un número y su ${a===3?'tercera':'quinta'} parte» se puede expresar como:`,a===3?'x + x/3':'x + x/5',[a===3?'x + 3x':'x + 5x',a===3?'x/3':'x/5',a===3?'x + 3':'x + 5'],`Se suma el número x con una fracción del mismo número.`,null,'La parte se representa dividiendo x entre el número indicado.');
if(k===3)add('language',`¿Cuál de las siguientes expresiones es un trinomio?`,`3x² + ${a}x − ${b}`,[`3x + ${a}`,`4x²`,`x² + ${a}x − ${b} + 2y`],`Un trinomio tiene exactamente tres términos separados por + o −.`,null,'Cuenta los términos, no las letras.');
if(k===4)add('language',`¿Cuál es el grado del monomio ${a}x³y²?`,'5',['3','2',String(a)],'El grado de un monomio es la suma de los exponentes de las variables: 3+2=5.',null,'El coeficiente numérico no cambia el grado.');
if(k===5)add('language',`Si M es la edad de Mateo y una familiar tiene ${b} años más, ¿qué expresión representa esa edad?`,`M + ${b}`,[`M − ${b}`,`${b}M`,`M/${b}`],`«Años más» indica sumar ${b} a la edad M.`,null,'Se suma una cantidad fija, no se multiplica.');
}
// Términos semejantes y perímetros algebraicos: 22.
for(let i=0;i<22;i++){let a=5+i%7,b=2+i%4,c=3+(i*2)%5,d=1+i%3,k=i%5;
if(k===0){let coef=a-b;add('terms',`Reduce ${a}x + ${c}y − ${b}x + ${d}y.`,`${coef}x + ${c+d}y`,[`${a+b}x + ${c+d}y`,`${coef}x + ${c-d}y`,`${coef+c+d}xy`],`Agrupamos las x y las y: (${a}−${b})x+(${c}+${d})y=${coef}x+${c+d}y.`,null,'Separa los términos en x de los términos en y.');}
if(k===1){let coef=a+c-b;add('terms',`Reduce ${a}a + ${c}a − ${b}a.`,`${coef}a`,[`${a+c+b}a`,`${coef+1}a`,`${coef}a²`],`Los tres términos tienen la misma parte literal a: ${a}+${c}−${b}=${coef}.`,null,'Mantén la letra y opera solo los coeficientes.');}
if(k===2){let cx=a-b;add('terms',`¿Cuál es la forma reducida de ${a}x + ${c} − ${b}x + ${d}?`,`${cx}x + ${c+d}`,[`${a+b}x + ${c+d}`,`${cx}x + ${c-d}`,`${cx+c+d}x`],`Los términos x se reducen por separado de los números: ${cx}x+${c+d}.`,null,'No mezcles cantidades con x y constantes.');}
if(k===3){let right=`${2*a}x + ${2*c}`;add('terms',`Un rectángulo tiene largo ${a}x y ancho ${c} unidades. ¿Cuál es su perímetro?`,right,[`${a*c}x`,`2${a}x + ${c}`,`${a+c}x`],`El contorno suma dos largos y dos anchos: 2·${a}x+2·${c}=${right}.`,rectSvg(`${a}x`,`${c}`),'El perímetro corresponde a la suma de los cuatro lados.');}
if(k===4){let total=a+c+b;add('terms',`Un triángulo tiene lados ${a}x, ${c}x y ${b}x. ¿Cuál es su perímetro?`,`${total}x`,[`${a*c*b}x³`,`${total+1}x`,`${total}x²`],`Perímetro=${a}x+${c}x+${b}x=${total}x.`,triangleSvg(`${a}x`,`${c}x`,`${b}x`),'Suma los tres lados y reduce términos semejantes.');}
}
// Valorización, expresiones y perímetro con variable: 20.
for(let i=0;i<20;i++){let a=2+i%5,b=1+(i*3)%8,x=2+i%6,y=1+i%4,k=i%5;
if(k===0){let v=a*x+b;add('values',`Si x=${x}, ¿cuánto vale ${a}x + ${b}?`,v,[v+a,v-b,v+1],`Sustituimos x=${x}: ${a}·${x}+${b}=${v}.`,null,'Primero multiplica, después suma.');}
if(k===1){let v=a*x-b;add('values',`Valoriza ${a}x − ${b} para x=${x}.`,v,[v+b,v+a,v-1],`Reemplazamos x=${x}: ${a}·${x}−${b}=${v}.`,null,'Aplica las operaciones en orden.');}
if(k===2){let v=a*x+b*y;add('values',`Calcula ${a}x + ${b}y para x=${x} e y=${y}.`,v,[v+a,v+b,v-1],`Sustituye ambas variables: ${a}·${x}+${b}·${y}=${v}.`,null,'Hay dos letras distintas, cada una con su valor.');}
if(k===3){let v=x*x+a;add('values',`Si x=${x}, calcula x² + ${a}.`,v,[x*2+a,v+x,v-1],`Primero elevamos ${x}²=${x*x}; luego sumamos ${a}: ${v}.`,null,'Elevar al cuadrado no es multiplicar por dos.');}
if(k===4){let v=2*(a*x+b*x);add('values',`Un rectángulo tiene largo ${a}x y ancho ${b}x. ¿Cuál es su perímetro cuando x=${x}?`,v,[a*b*x*x,(a+b)*x,v+2*x],`P=2(${a}x+${b}x)=2·(${a+b})·${x}=${v}.`,rectSvg(`${a}x`,`${b}x`),'Calcula ambos lados y aplica P=2(largo+ancho).');}
}
// Ecuaciones, planteamiento, balanzas y operaciones: 24.
for(let i=0;i<24;i++){let a=2+i%5,x=3+i%7,b=2+(i*2)%9,k=i%6,y=a*x+b;
if(k===0)add('equations',`Resuelve ${a}x + ${b} = ${y}.`,x,[x+1,x-1,x+2],`Resta ${b}: ${a}x=${a*x}. Divide por ${a}: x=${x}.`,null,'Deshaz primero la suma y luego la multiplicación.');
if(k===1){let target=a*x;add('equations',`¿Qué operación permite despejar x en ${a}x = ${target}?` ,`Dividir ambos lados entre ${a}.`,[`Multiplicar ambos lados por ${a}.`,`Sumar ${a} a ambos lados.`,`Restar ${a} a ambos lados.`],`Al dividir ${a}x=${target} entre ${a}, queda x=${x}.`,null,'Piensa en la operación inversa de multiplicar.');}
if(k===2){let original=3*x+b;add('equations',`Una caja contiene x fichas. Si juntas 3 cajas y ${b} fichas sueltas tienes ${original} fichas, ¿qué ecuación lo representa?`,`3x + ${b} = ${original}`,[`3 + ${b}x = ${original}`,`3x − ${b} = ${original}`,`x + ${b} = ${original}`],`Son tres grupos de x más ${b} unidades sueltas: 3x+${b}=${original}.`,balanceSvg(3,b,0,original),'Traduce por separado los grupos iguales y las unidades.');}
if(k===3){let target=x+a;add('equations',`La suma de un número y su sucesor es ${2*x+1}. ¿Cuál es ese número?`,x,[x+1,x-1,x+2],`Si el número es x, su sucesor es x+1. Entonces 2x+1=${2*x+1}; x=${x}.`,null,'El sucesor de un número es una unidad mayor.');}
if(k===4){let total=3*x+b;add('equations',`En una compra se pagan ${b*100} pesos por una bolsa y ${total*100} pesos en total por 3 artículos iguales. ¿Cuánto cuesta cada artículo?`,x*100,[(x+1)*100,(x-1)*100,(x+2)*100],`Restamos ${b*100} pesos por la bolsa y dividimos los ${(total-b)*100} restantes entre 3: $${x*100}.`,null,'Primero descuenta el costo fijo y luego reparte el resto.');}
if(k===5){let rhs=2*x+b;add('equations',`¿Cuál de estas ecuaciones representa una balanza con 2 bolsas x y ${b} unidades a la izquierda, y ${rhs} unidades a la derecha?`,`2x + ${b} = ${rhs}`,[`2x − ${b} = ${rhs}`,`x + ${b} = ${rhs}`,`2x + ${rhs} = ${b}`],`Cada bolsa representa x; el platillo izquierdo contiene 2x+${b}, equilibrado con ${rhs} unidades.`,balanceSvg(2,b,0,rhs),'Una balanza nivelada indica igualdad entre los dos lados.');}
}
// Inecuaciones, situaciones, solución y gráfica: 24.
for(let i=0;i<24;i++){let a=2+i%4,b=2+i%6,threshold=2+i%5,k=i%6;let rhs=a*threshold+b;
if(k===0)add('inequalities',`Resuelve la inecuación ${a}x + ${b} > ${rhs}.`,`x > ${threshold}`,[`x < ${threshold}`,`x ≥ ${threshold}`,`x > ${threshold+1}`],`Resta ${b} y divide por ${a} positivo: x>${threshold}.`,null,'Al dividir por un número positivo no cambia el signo.');
if(k===1)add('inequalities',`Resuelve ${a}x − ${b} ≤ ${a*threshold-b}.`,`x ≤ ${threshold}`,[`x ≥ ${threshold}`,`x < ${threshold}`,`x ≤ ${threshold+1}`],`Sumamos ${b} a ambos lados y dividimos entre ${a}: x≤${threshold}.`,null,'«A lo más» incluye el extremo.');
if(k===2){let n=threshold+2;add('inequalities',`¿Qué valor cumple 5 + x < ${5+n}?`,n-1,[n,n+1,n+2],`La condición es x<${n}. Solo ${n-1} entre estas opciones es menor que ${n}.`,null,'Despeja x y comprueba las cuatro alternativas.');}
if(k===3){let t=threshold;add('inequalities',`La solución x ≥ ${t} se representa con:`,`Punto cerrado en ${t} y flecha a la derecha.`,[`Punto abierto en ${t} y flecha a la derecha.`,`Punto cerrado en ${t} y flecha a la izquierda.`,`Punto abierto en ${t} y flecha a la izquierda.`],`El signo ≥ incluye ${t} (punto lleno) y toma todos los mayores (derecha).`,numberlineSvg(t,'>',true),'Observa inclusión del extremo y dirección de la flecha.');}
if(k===4){let t=threshold;add('inequalities',`Observa la recta numérica. ¿Qué inecuación representa?`,`x < ${t}`,[`x ≤ ${t}`,`x > ${t}`,`x ≥ ${t}`],`El punto vacío excluye ${t} y la flecha a la izquierda muestra los menores: x<${t}.`,numberlineSvg(t,'<',false),'Punto abierto excluye el número marcado.');}
if(k===5){let c=threshold+2;add('inequalities',`«El doble de un número disminuido en ${b} es mayor que ${2*c-b}». ¿Qué inecuación expresa el enunciado?`,`2x − ${b} > ${2*c-b}`,[`2x + ${b} > ${2*c-b}`,`2x − ${b} < ${2*c-b}`,`x/2 − ${b} > ${2*c-b}`],`El doble es 2x, disminuir es restar ${b}, y «mayor que» se representa con >.`,null,'Traduce las operaciones y el signo de comparación.');}
}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function readable(q){return {...q,options:shuffle(q.opts)}}
function save(){try{localStorage.setItem('pdn-obby-7-save',JSON.stringify({mode,questions:questions.map(q=>({id:q.id,options:q.options})),idx,answers,started,remaining,chosenTopic,feedback,helpLevel}))}catch(e){}}function clearSave(){try{localStorage.removeItem('pdn-obby-7-save')}catch(e){}}function resume(){try{let s=JSON.parse(localStorage.getItem('pdn-obby-7-save'));if(!s)return;mode=s.mode;questions=s.questions.map(item=>{let id=typeof item==='string'?item:item.id;let q=bank.find(q=>q.id===id);return q?{...q,options:Array.isArray(item.options)&&item.options.length===4?item.options:shuffle(q.opts)}:null}).filter(Boolean);if(!questions.length)throw Error('Partida sin preguntas');idx=Math.min(s.idx||0,questions.length-1);answers=s.answers||{};started=Date.now();remaining=s.remaining??4200;chosenTopic=s.chosenTopic||'all';screen='quiz';feedback=mode==='training'&&!!answers[questions[idx].id];helpLevel=s.helpLevel||0;draw();if(mode==='exam')timerStart()}catch(e){home()}}
function header(){return `<div class="row between"><span class="tag">🎮 MISIÓN PDN · 7° BÁSICO</span><button class="ghost topbtn" onclick="home()">⌂ Menú</button></div>`}function home(){clearInterval(clock);screen='home';draw()}function setName(v){try{localStorage.setItem('pdn-student',v)}catch(e){}}function getName(){try{return localStorage.getItem('pdn-student')||''}catch(e){return ''}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function start(kind){mode=kind;chosenTopic=$('topicPick')?.value||'all';let sample=chosenTopic==='all'?topics.flatMap(([t])=>shuffle(bank.filter(q=>q.topic===t)).slice(0,6)):shuffle(bank.filter(q=>q.topic===chosenTopic)).slice(0,mode==='exam'?15:12);questions=shuffle(sample).map(readable);answers={};idx=0;remaining=4200;started=Date.now();feedback=false;helpLevel=0;stepsShown=1;screen='quiz';save();draw();if(mode==='exam')timerStart()}function timerStart(){clearInterval(clock);clock=setInterval(()=>{if(screen!=='quiz'||mode!=='exam')return;remaining=Math.max(0,remaining-1);let c=$('clock');if(c)c.textContent=formatTime(remaining);if(!remaining)finish();if(remaining%10===0)save()},1000)}function formatTime(s){return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`}
function showStudy(topic,origin='home'){if(mode==='exam'&&screen==='quiz')return;studyTopic=topic;studyOrigin=origin;stepsShown=1;screen='study';draw()}function backStudy(){screen=studyOrigin==='quiz'?'quiz':'home';draw()}function nextStep(){stepsShown=Math.min(lessons[studyTopic].steps.length,stepsShown+1);draw()}function choose(i){let q=questions[idx];if(mode==='training'&&feedback)return;answers[q.id]=q.options[i];if(mode==='training'){feedback=true;avatarJump=answers[q.id]===q.correct?1:-1;setTimeout(()=>{avatarJump=0},650)}save();draw()}function next(){if(idx<questions.length-1){idx++;feedback=mode==='training'&&!!answers[questions[idx].id];helpLevel=0;save();draw()}else finish()}function prev(){if(idx>0){idx--;feedback=mode==='training'&&!!answers[questions[idx].id];helpLevel=0;save();draw()}}function jump(i){idx=i;feedback=mode==='training'&&!!answers[questions[idx].id];helpLevel=0;save();draw()}function hint(n){helpLevel=n;draw()}function finish(){clearInterval(clock);screen='result';clearSave();draw()}function repeatMistakes(){let wrong=questions.filter(q=>answers[q.id]!==q.correct);if(!wrong.length){start('training');return}let ts=[...new Set(wrong.map(q=>q.topic))],chosen=shuffle(bank.filter(q=>ts.includes(q.topic)&&!questions.some(p=>p.id===q.id))).slice(0,Math.max(5,Math.min(10,wrong.length*2)));if(chosen.length<5)chosen.push(...shuffle(bank.filter(q=>ts.includes(q.topic))).slice(0,5-chosen.length));questions=shuffle(chosen).map(readable);idx=0;mode='training';answers={};feedback=false;helpLevel=0;screen='quiz';save();draw()}
function results(){let right=questions.filter(q=>answers[q.id]===q.correct).length,total=questions.length,wrong=total-right,pct=Math.round(100*right/total);let breakdown=topics.map(([t,name])=>{let qs=questions.filter(q=>q.topic===t);if(!qs.length)return '';let hits=qs.filter(q=>answers[q.id]===q.correct).length;return `<div class="row between light"><span>${name}</span><b>${hits}/${qs.length}</b></div>`}).join('');return `${header()}<div class="center"><div class="character">${pct>=80?'🏆':pct>=60?'⭐':'💪'}</div><h1>¡Misión completada!</h1><p>¡Lo importante es seguir practicando!</p></div><div class="row" style="justify-content:center"><div class="stat">Correctas<strong>${right}</strong></div><div class="stat">Por mejorar<strong>${wrong}</strong></div><div class="stat">Logro<strong>${pct}%</strong></div></div><h3>Tu avance por mundo</h3>${breakdown}<h3>🚦 Semáforo de autoevaluación</h3><div class="grid2"><button class="ghost" onclick="selfEval('🟢 Comprendo y resuelvo solo')">🟢 Verde</button><button class="ghost" onclick="selfEval('🟡 Necesito practicar')">🟡 Amarillo</button><button class="ghost" onclick="selfEval('🔴 Necesito más apoyo')">🔴 Rojo</button></div><p id="evalText" class="small"></p><label><b>¿Qué contenido necesitas reforzar?</b><br><input id="reflection" style="width:100%" placeholder="Escribe tu reflexión"></label><h3>Revisión de preguntas</h3>${questions.map((q,i)=>`<details><summary>${i+1}. ${escapeHtml(q.prompt)} ${answers[q.id]===q.correct?'✅':'📘'}</summary><p>Tu respuesta: <b>${escapeHtml(answers[q.id]||'Sin responder')}</b></p><p>Respuesta correcta: <b>${escapeHtml(q.correct)}</b></p><p>${escapeHtml(q.explain)}</p></details>`).join('')}<div class="row"><button class="blue" onclick="repeatMistakes()">🔄 Practicar mis errores</button><button onclick="downloadCSV()">⬇ Descargar resultados CSV</button><button class="ghost" onclick="home()">Menú principal</button></div>`}
function selfEval(v){let e=$('evalText');if(e)e.textContent='Autoevaluación: '+v}function downloadCSV(){let name=getName();let lines=[['Nombre','Modo','Número','Tema','Pregunta','Respuesta estudiante','Respuesta correcta','Resultado']];questions.forEach((q,i)=>lines.push([name,mode,i+1,lessons[q.topic].title,q.prompt,answers[q.id]||'',q.correct,answers[q.id]===q.correct?'Correcta':'Incorrecta']));let reflection=$('reflection')?.value||'';lines.push(['Reflexión',reflection]);const csv='\ufeff'+lines.map(a=>a.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let link=document.createElement('a');link.href=url;link.download='resultado-mision-pdn.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function figure(q){return q.graphic?`<div class="figure svg-wrap">${q.graphic}</div>`:''}function quiz(){let q=questions[idx],response=answers[q.id],right=response===q.correct,done=Object.keys(answers).length;let controls=`<div class="row between"><button class="ghost" onclick="prev()" ${idx===0?'disabled':''}>← Anterior</button><div class="row">${mode==='training'?`<button class="ghost" onclick="showStudy('${q.topic}','quiz')">📚 Ir a estudiar</button>`:''}<button class="blue" onclick="${idx===questions.length-1?'finish()':'next()'}">${idx===questions.length-1?'Finalizar':'Siguiente →'}</button></div></div>`;return `${header()}<div class="row between" style="margin-top:13px"><span class="pill">${mode==='exam'?'📝 Simulacro PDN':'🧩 Entrenamiento'}</span><span class="pill">Pregunta ${idx+1} de ${questions.length}</span>${mode==='exam'?`<span class="pill">⏱ <span id="clock">${formatTime(remaining)}</span></span>`:''}</div><div class="progress" style="margin:13px 0"><div style="width:${100*done/questions.length}%"></div></div><span class="tag">${topics.find(t=>t[0]===q.topic)[1]}</span><div class="question">${escapeHtml(q.prompt)}</div>${figure(q)}<div class="choices">${q.options.map((o,i)=>`<button class="choice ${response===o?'selected':''} ${feedback&&response===o?(right?'correct':'wrong'):''}" onclick="choose(${i})"><span>${'ABCD'[i]}</span>${escapeHtml(o)}</button>`).join('')}</div>${mode==='training'?`<div class="row"><button class="ghost" onclick="hint(${Math.min(helpLevel+1,3)})">💡 Necesito ayuda ${helpLevel?`(${helpLevel}/3)`:''}</button></div>${helpLevel?`<div class="study"><b>💡 Nivel ${helpLevel}</b><p>${helpLevel===1?escapeHtml(lessons[q.topic].definition):helpLevel===2?`Ejemplo diferente: ${escapeHtml(lessons[q.topic].steps.join(' '))}`:escapeHtml(q.hint)}</p></div>`:''}${feedback?`<div class="explain"><b>${right?'✅ ¡Buen trabajo!':'📘 Aprendamos del error'}</b><p>${escapeHtml(q.explain)}</p></div>`:''}`:'<p class="small">En el simulacro no se muestran respuestas ni ayudas durante la prueba. Puedes cambiar tus elecciones antes de finalizar.</p>'}<div class="qnav">${questions.map((p,i)=>`<button class="${i===idx?'current':''} ${answers[p.id]?'done':''}" onclick="jump(${i})">${i+1}</button>`).join('')}</div>${controls}<div class="footer">Las preguntas de práctica son nuevas y no revelan la clave de la evaluación original.</div>`}
function study(){let l=lessons[studyTopic];return `${header()}<h2>📚 Academia Matemática</h2><div class="row between"><span class="tag">🤖 PROFE BLOCK: ¡Tú puedes!</span><button class="ghost" onclick="backStudy()">↩ Regresar</button></div><p>Elige un mundo para repasar y luego vuelve a la aventura.</p><div class="row">${topics.map(([id,t])=>`<button class="${id===studyTopic?'blue':'ghost'} topbtn" onclick="showStudy('${id}','${studyOrigin}')">${t}</button>`).join('')}</div><div class="study"><h2>${l.title}</h2><p>${l.definition}</p><p><b>Consejo:</b> ${l.tip}</p></div><h3>✏️ Ejercicio explicado paso a paso</h3>${l.steps.slice(0,stepsShown).map((s,i)=>`<div class="step"><b>Paso ${i+1}.</b> ${s}</div>`).join('')}<div class="row" style="margin-top:13px"><button onclick="nextStep()" ${stepsShown===l.steps.length?'disabled':''}>Ver paso siguiente →</button><button class="ghost" onclick="stepsShown=1;draw()">↶ Volver a explicar</button></div>${stepsShown===l.steps.length?`<div class="explain"><b>¡Ahora inténtalo tú!</b><p>${l.practice}</p></div>`:''}<div class="row"><button class="blue" onclick="backStudy()">🎮 Volver al Obby</button><button class="ghost" onclick="start('training')">Practicar preguntas</button></div>`}
function draw(){gameProgress=screen==='quiz'?idx/(questions.length||1):screen==='result'?1:0;if(screen==='home'){let exists=false;try{exists=!!localStorage.getItem('pdn-obby-7-save')}catch(e){}panel.innerHTML=`<div class="center"><div class="character">🧱🎮🏆</div><span class="tag">Colegio · Matemática 7° básico</span><h1>MISIÓN PDN</h1><h2>¡El Gran Obby Algebraico!</h2><p>Salta entre plataformas, resuelve desafíos y estudia con PROFE BLOCK. ¡Cada respuesta te hace avanzar!</p></div><div class="light"><label><b>Nombre del explorador:</b> <input maxlength="70" value="${escapeHtml(getName())}" oninput="setName(this.value)" placeholder="Tu nombre (opcional)"></label></div><div class="grid2"><div class="card"><h3>🧩 Entrenamiento</h3><p>Practica con ayudas, explicaciones inmediatas y sin límite de tiempo.</p><button class="blue" onclick="start('training')">Jugar y aprender</button></div><div class="card"><h3>📝 Simulacro PDN</h3><p>30 preguntas, 70 minutos y resultados al finalizar, como ensayo de prueba.</p><button onclick="start('exam')">Iniciar simulacro</button></div></div><div class="light"><label><b>Seleccionar mundo:</b> <select id="topicPick"><option value="all">🌎 Todos los mundos (recomendado)</option>${topics.map(([id,name])=>`<option value="${id}">${name}</option>`).join('')}</select></label><p class="small">El simulacro completo de 30 preguntas usa la opción «Todos los mundos». Al elegir uno solo, es una práctica temática más corta.</p></div><div class="row"><button class="ghost" onclick="showStudy('language','home')">📚 Entrar a la Academia</button>${exists?'<button class="ghost" onclick="resume()">▶ Continuar partida</button>':''}</div><p class="footer">Juego original inspirado en aventuras de plataformas tipo Obby · Funciona sin internet · ${bank.length} preguntas originales</p>`}else if(screen==='quiz')panel.innerHTML=quiz();else if(screen==='study')panel.innerHTML=study();else if(screen==='result')panel.innerHTML=results()}
// Escenario animado de plataformas con perspectiva y avatar original estilo blocky.
const canvas=$('scene'),ctx=canvas.getContext('2d');let W=0,H=0,t=0;function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}addEventListener('resize',resize);resize();function polygon(points,fill,stroke){ctx.beginPath();ctx.moveTo(...points[0]);points.slice(1).forEach(p=>ctx.lineTo(...p));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}function avatar(x,y,s=1){ctx.save();ctx.translate(x,y+Math.sin(t*2)*3-(avatarJump>0?17:avatarJump<0?-11:0));ctx.scale(s,s);ctx.fillStyle='#24336c';ctx.fillRect(-13,19,11,22);ctx.fillRect(3,19,11,22);ctx.fillStyle='#28b48b';ctx.fillRect(-22,-11,44,34);ctx.fillStyle='#f3bd7a';ctx.fillRect(-34,-8,12,29);ctx.fillRect(22,-8,12,29);ctx.fillRect(-17,-39,34,30);ctx.fillStyle='#343c53';ctx.fillRect(-7,-25,4,4);ctx.fillRect(7,-25,4,4);ctx.restore()}function renderScene(){t+=.012;let w=innerWidth,h=innerHeight;let grad=ctx.createLinearGradient(0,0,0,h);grad.addColorStop(0,'#69bafd');grad.addColorStop(.75,'#c4e8ff');grad.addColorStop(1,'#f7faff');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);for(let i=0;i<9;i++){let xx=((i*239+t*(8+i%4))%(w+280))-140,yy=36+(i*103)%(h*.54);ctx.fillStyle='#ffffffaa';ctx.beginPath();ctx.ellipse(xx,yy,65,19,0,0,Math.PI*2);ctx.ellipse(xx+35,yy-11,35,25,0,0,Math.PI*2);ctx.ellipse(xx-24,yy-10,30,22,0,0,Math.PI*2);ctx.fill()}for(let i=0;i<8;i++){let depth=i/8,px=w*.11+depth*w*.87,py=h*.77-depth*h*.52+Math.sin(t+i)*5;let s=1.15-depth*.6;polygon([[px-76*s,py],[px+76*s,py],[px+45*s,py+37*s],[px-104*s,py+37*s]],['#79d989','#ffdc72','#a97bf0','#6bd7ed'][i%4]);polygon([[px-104*s,py+37*s],[px+45*s,py+37*s],[px+45*s,py+54*s],[px-104*s,py+54*s]],'#4875a5');polygon([[px+45*s,py+37*s],[px+76*s,py],[px+76*s,py+16*s],[px+45*s,py+54*s]],'#335c93')}avatar(w*.11,h*.72,.9);requestAnimationFrame(renderScene)}requestAnimationFrame(renderScene);draw();
</script></body></html>
